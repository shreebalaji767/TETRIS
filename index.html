<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>VOIDBLOCK — Tetris</title>
<meta name="theme-color" content="#05070b">
<meta name="description" content="VOIDBLOCK — responsive Tetris game.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VOIDBLOCK">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="shortcut icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070b;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    overscroll-behavior: none;
}


/* =========================================================
   BUTTONS
   ========================================================= */

button {
    border: 0;
    color: white;
    background: #151a24;
    border-radius: 12px;
    cursor: pointer;
    user-select: none;

    /*
       Important for Android/iPhone/iPad/tablets.
    */
    touch-action: manipulation;

    -webkit-user-select: none;
    -webkit-touch-callout: none;

    font-weight: 700;
}

button:active {
    transform: scale(.94);
}

button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
}


/* =========================================================
   APP
   ========================================================= */

#app {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 12px;

    touch-action: none;
}


/* =========================================================
   GAME SHELL
   ========================================================= */

.game-shell {
    width: min(1100px, 100%);
    height: min(900px, 100%);

    display: grid;

    grid-template-columns:
        180px
        minmax(280px, 430px)
        180px;

    gap: 22px;

    align-items: center;
    justify-content: center;
}


/* =========================================================
   SIDE PANELS
   ========================================================= */

.side {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.logo {
    font-size: 26px;
    letter-spacing: 5px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 8px;
}

.panel {
    background:
        linear-gradient(
            145deg,
            #111722,
            #090c12
        );

    border: 1px solid #252d3a;

    border-radius: 16px;

    padding: 14px;

    box-shadow:
        inset 0 1px rgba(255,255,255,.04),
        0 10px 30px rgba(0,0,0,.3);
}

.label {
    color: #7e899b;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 6px;
}

.value {
    font-size: 25px;
    font-weight: 900;
}

.music-panel{background:linear-gradient(145deg,#111722,#090c12);border:1px solid #252d3a;border-radius:16px;padding:11px;margin-top:8px}
.music-title{color:#7e899b;font-size:10px;letter-spacing:2px;margin-bottom:7px}
.music-row{display:grid;grid-template-columns:1fr auto;gap:6px}
.music-btn,.music-file{min-height:34px;border:1px solid #293342;background:#151a24;color:#fff;border-radius:9px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer}
.music-file{padding:0 10px}
.music-track{margin-top:6px;color:#8d99ad;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-volume{width:100%;margin-top:7px;accent-color:#fff}
#nextCanvas,
#holdCanvas {
    width: 100%;
    height: 100px;

    display: block;

    touch-action: none;
}


/* =========================================================
   BOARD
   ========================================================= */

.board-wrap {
    position: relative;

    width: 100%;

    aspect-ratio: 10 / 20;

    max-height: 82vh;

    margin: auto;

    touch-action: none;
}

#gameCanvas {
    width: 100%;
    height: 100%;

    display: block;

    background: #080b11;

    border: 2px solid #293342;

    border-radius: 14px;

    box-shadow:
        0 0 50px rgba(0,0,0,.65),
        inset 0 0 30px rgba(0,0,0,.5);

    /*
       CRITICAL FOR TOUCH CONTROLS.
    */
    touch-action: none;

    -webkit-user-select: none;
    user-select: none;
}


/* =========================================================
   OVERLAY
   ========================================================= */

.overlay {
    position: absolute;

    inset: 2px;

    border-radius: 12px;

    background: rgba(3,5,9,.86);

    backdrop-filter: blur(8px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 14px;

    text-align: center;

    z-index: 10;

    padding: 20px;

    touch-action: manipulation;
}

.overlay.hidden {
    display: none;
}

.overlay h1 {
    font-size: clamp(28px, 7vw, 52px);

    letter-spacing: 6px;
}

.overlay p {
    color: #8994a7;

    min-height: 20px;
}

.overlay-actions {
    width: min(230px, 85%);

    display: flex;

    flex-direction: column;

    gap: 10px;
}

.overlay-btn {
    width: 100%;

    min-height: 48px;

    font-size: 14px;

    letter-spacing: 1px;
}

.primary {
    background: #fff;

    color: #05070b;
}

.secondary {
    background: #151a24;

    border: 1px solid #303a4a;
}

.danger {
    background: #35161b;

    border: 1px solid #7d3039;
}

.hidden-btn {
    display: none !important;
}


/* =========================================================
   CONTROLS
   ========================================================= */

.controls {
    /* Hidden by default on mouse/keyboard-only devices.
       JavaScript adds .touch-device when a touchscreen is detected. */
    display: none;

    flex-direction: column;

    gap: 9px;
}

/* Show on-screen controls only when a touchscreen is available. */
.touch-device .controls {
    display: flex;
}

/* Keep the desktop layout clean when no touchscreen exists. */
.non-touch .controls {
    display: none !important;
}

.control-row {
    display: flex;

    gap: 9px;
}

.control {
    flex: 1;

    min-height: 54px;

    font-size: 19px;

    border: 1px solid #293342;
}

.rotate {
    background: #222b3a;

    font-size: 24px;
}

.drop {
    width: 100%;

    min-height: 58px;

    background: #f0f2f5;

    color: #05070b;

    font-size: 13px;
}

.action {
    width: 100%;

    min-height: 44px;
}

.exit-action {
    background: #35161b;

    border: 1px solid #6b2a32;
}


/* =========================================================
   RESPONSIVE LAYOUT
   ========================================================= */

/* Desktop / large tablets */
@media (min-width: 801px) {
    #app {
        padding:
            max(12px, env(safe-area-inset-top))
            max(12px, env(safe-area-inset-right))
            max(12px, env(safe-area-inset-bottom))
            max(12px, env(safe-area-inset-left));
    }

    .game-shell {
        width: min(1100px, 100%);
        height: min(900px, 100%);
        grid-template-columns:
            clamp(150px, 17vw, 180px)
            minmax(280px, 430px)
            clamp(150px, 17vw, 180px);
        gap: clamp(10px, 2vw, 22px);
    }

    .board-wrap {
        width: min(100%, 430px);
        height: min(82vh, 860px);
        aspect-ratio: 10 / 20;
    }
}

/* Tablets and phones in portrait */
@media (max-width: 800px) {
    html,
    body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
    }

    #app {
        width: 100%;
        height: 100dvh;
        min-height: 100svh;
        padding:
            max(4px, env(safe-area-inset-top))
            max(4px, env(safe-area-inset-right))
            max(4px, env(safe-area-inset-bottom))
            max(4px, env(safe-area-inset-left));
        overflow: hidden;
    }

    .game-shell {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 0;
        overflow: hidden;
    }

    .side {
        display: contents;
    }

    .logo {
        position: absolute;
        top: max(6px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        font-size: clamp(15px, 4.5vw, 21px);
        line-height: 1;
        letter-spacing: clamp(2px, 1vw, 4px);
        white-space: nowrap;
        pointer-events: none;
    }

    .left-panel,
    .right-panel {
        position: static;
    }

    .left-panel > .panel:nth-child(2),
    .right-panel > .panel:nth-child(1) {
        display: block;
    }

    /* Compact score / level / lines HUD */
    .left-panel > .panel:nth-child(2) {
        position: absolute;
        top: max(34px, calc(env(safe-area-inset-top) + 28px));
        left: max(6px, env(safe-area-inset-left));
        z-index: 5;
        padding: 5px 8px;
    }

    .left-panel > .panel:nth-child(3) {
        position: absolute;
        top: max(34px, calc(env(safe-area-inset-top) + 28px));
        left: max(6px, env(safe-area-inset-left));
        z-index: 5;
        padding: 5px 8px;
        transform: translateY(34px);
    }

    .left-panel > .panel:nth-child(4) {
        position: absolute;
        top: max(34px, calc(env(safe-area-inset-top) + 28px));
        left: max(6px, env(safe-area-inset-left));
        z-index: 5;
        padding: 5px 8px;
        transform: translateY(68px);
    }

    .right-panel .panel {
        position: absolute;
        top: max(34px, calc(env(safe-area-inset-top) + 28px));
        right: max(6px, env(safe-area-inset-right));
        z-index: 5;
        padding: 5px 8px;
    }

    .right-panel .panel .label {
        margin-bottom: 0;
    }

    /*
       TOUCH CONTROLS GET THEIR OWN SPACE BELOW THE BOARD.
       They are NOT positioned over the game canvas, so the
       falling pieces and playfield remain fully visible.
    */
    .right-panel .controls {
        position: static;
        z-index: 6;
        width: min(96vw, 430px);
        margin: 6px auto max(4px, env(safe-area-inset-bottom));
        padding: 0;
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
    }

    .music-panel{position:absolute;right:max(6px,env(safe-area-inset-right));top:max(74px,calc(env(safe-area-inset-top) + 68px));z-index:25;width:126px;padding:7px;border-radius:9px;background:rgba(8,11,17,.88);backdrop-filter:blur(5px)}
    .music-title{font-size:7px;margin-bottom:4px}
    .music-row{gap:4px}
    .music-btn,.music-file{min-height:28px;font-size:8px;border-radius:7px;padding:0 5px}
    .music-track{font-size:7px;margin-top:4px}
    .music-volume{margin-top:4px}
    .panel {
        background: rgba(8, 11, 17, .82);
        border-radius: 9px;
        backdrop-filter: blur(5px);
    }

    .label {
        font-size: 7px;
        letter-spacing: 1px;
        margin-bottom: 1px;
    }

    .value {
        font-size: clamp(13px, 4vw, 17px);
        line-height: 1;
    }

    #nextCanvas,
    #holdCanvas {
        display: none;
    }

    /*
       Reserve vertical space for the touch controls.
       The board is never covered by the buttons.
       10:20 ratio is preserved at every size.
    */
    .board-wrap {
        flex: 0 1 auto;
        width: min(
            94vw,
            calc((100dvh - 158px) / 2),
            430px
        );
        height: auto;
        max-width: 430px;
        max-height: calc(100dvh - 158px);
        aspect-ratio: 10 / 20;
        align-self: center;
        justify-self: center;
        margin: 0 auto;
        min-height: 0;
        flex-shrink: 1;
    }

    #gameCanvas {
        width: 100%;
        height: 100%;
    }

    .controls {
        gap: 6px;
    }

    /* Flatten the controls into a compact touch pad. */
    .control-row {
        display: contents;
    }

    .control,
    .drop,
    .action {
        min-width: 0;
        min-height: clamp(42px, 7dvh, 52px);
        height: clamp(42px, 7dvh, 52px);
        margin: 0;
    }

    .control {
        font-size: clamp(16px, 4.8vw, 21px);
    }

    .rotate {
        font-size: clamp(21px, 5.8vw, 27px);
    }

    .drop {
        font-size: clamp(10px, 2.8vw, 12px);
    }

    .action {
        font-size: clamp(10px, 2.8vw, 12px);
    }

    button {
        -webkit-tap-highlight-color: transparent;
    }
}

/* Very small portrait phones */
@media (max-width: 390px) and (orientation: portrait) {
    .board-wrap {
        width: min(
            92vw,
            calc((100dvh - 136px) / 2)
        );
        max-height: calc(100dvh - 150px);
        min-height: 0;
    }

    .left-panel > .panel:nth-child(2),
    .left-panel > .panel:nth-child(3),
    .left-panel > .panel:nth-child(4),
    .right-panel .panel {
        padding: 4px 6px;
    }

    .label {
        font-size: 6px;
    }

    .value {
        font-size: 12px;
    }

    .right-panel .controls {
        width: min(96vw, 360px);
        gap: 4px;
        margin-top: 4px;
    }

    .control,
    .drop,
    .action {
        min-height: 40px;
        height: 40px;
    }

    .board-wrap {
        width: min(92vw, calc((100dvh - 150px) / 2));
        max-height: calc(100dvh - 150px);
    }
}

/* Landscape phones / short screens */
@media (max-height: 600px) and (orientation: landscape) {
    #app {
        padding: 3px;
    }

    .game-shell {
        display: grid;
        grid-template-columns:
            minmax(80px, 130px)
            minmax(180px, 42vh)
            minmax(80px, 130px);
        grid-template-rows: 1fr;
        align-items: center;
        justify-content: center;
        gap: clamp(5px, 1.5vw, 12px);
    }

    .logo {
        display: block;
        top: 5px;
        font-size: clamp(13px, 3vw, 18px);
    }

    .left-panel,
    .right-panel {
        display: flex;
        position: static;
        width: 100%;
        height: 100%;
        gap: 5px;
    }

    .left-panel {
        align-items: center;
    }

    .right-panel {
        align-items: center;
    }

    .left-panel .panel,
    .right-panel .panel {
        position: static;
        transform: none;
        width: 100%;
        padding: 6px;
    }

    .left-panel > .panel:nth-child(2),
    .left-panel > .panel:nth-child(3),
    .left-panel > .panel:nth-child(4),
    .right-panel .panel {
        position: static;
        transform: none;
    }

    .left-panel > .panel:nth-child(2) {
        display: block;
    }

    .left-panel > .panel:nth-child(2) {
        /* HOLD remains hidden on short landscape screens */
        display: none;
    }

    .left-panel > .panel:nth-child(3),
    .left-panel > .panel:nth-child(4) {
        display: block;
    }

    .right-panel .panel {
        display: block;
    }

    .right-panel .controls {
        position: static;
        width: 100%;
        transform: none;
        margin-top: auto;
        margin-bottom: 2px;
    }

    .board-wrap {
        grid-column: 2;
        grid-row: 1;
        width: min(42vh, 300px);
        height: min(84vh, 600px);
        max-height: calc(100dvh - 10px);
        min-height: 0;
        aspect-ratio: 10 / 20;
        margin: 0;
    }

    .control {
        min-height: clamp(34px, 10vh, 48px);
        font-size: clamp(14px, 3vw, 19px);
    }

    .rotate {
        font-size: clamp(18px, 4vw, 24px);
    }

    .drop,
    .action {
        min-height: clamp(30px, 8vh, 40px);
    }

    .label {
        font-size: 7px;
    }

    .value {
        font-size: 15px;
    }
}

/* Short landscape phones: keep controls below the board, never over it. */
@media (max-width: 800px) and (max-height: 600px) and (orientation: landscape) {
    .left-panel,
    .right-panel {
        display: contents;
    }

    .left-panel > .panel,
    .right-panel > .panel {
        display: none;
    }

    .game-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        overflow: hidden;
    }

    .board-wrap {
        width: min(40vh, 230px);
        height: min(80vh, 460px);
        max-height: calc(100dvh - 92px);
        flex: 0 1 auto;
        margin-top: 4px;
    }

    .right-panel .controls {
        width: min(94vw, 430px);
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
        margin: 4px auto max(2px, env(safe-area-inset-bottom));
    }

    .control,
    .drop,
    .action {
        min-height: 36px;
        height: 36px;
    }
}

/* Landscape tablets / short desktop windows */
@media (min-width: 801px) and (max-height: 650px) {
    .game-shell {
        grid-template-columns:
            140px
            minmax(220px, 330px)
            140px;
        gap: 10px;
    }

    .board-wrap {
        width: min(330px, 44vh);
        height: min(660px, 88vh);
    }

    .panel {
        padding: 9px;
    }

    .controls {
        gap: 6px;
    }

    .control {
        min-height: 46px;
    }
}

/* Prevent accidental text selection / browser gesture handling
   on touch controls. */
@media (pointer: coarse) {
    button,
    .board-wrap,
    #gameCanvas {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
    }
}

/* ===== VOIDBLOCK UPGRADE PACK ===== */
.upgrade-hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.upgrade-hud button{min-height:40px;border:1px solid #293342;background:#111722;color:#fff;border-radius:10px;font-weight:800}
.upgrade-hud .best{grid-column:1/-1;padding:8px 10px;border:1px solid #252d3a;border-radius:10px;background:#090c12;color:#8d99ad;font-size:10px;letter-spacing:1px}
.upgrade-hud strong{color:#fff;font-size:15px}
.install-upgrade{display:none}.install-upgrade.show{display:block}
.upgrade-toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#fff;color:#05070b;padding:10px 15px;border-radius:999px;font-weight:800;font-size:12px;z-index:100;transition:.2s}
.upgrade-toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.upgrade-hud{display:none}}



/* ===== DEVICE POLISH / QUICK ACTIONS ===== */
.quick-actions{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.quick-btn{width:100%;min-height:40px;border:1px solid #293342;background:#111722;color:#fff;border-radius:10px;font-weight:800}
.pwa-install{display:none}
.pwa-install.show{display:flex}
.pwa-install,.quick-btn{align-items:center;justify-content:center;gap:7px}
.pwa-install svg{width:16px;height:16px;flex:0 0 auto}
.logo-wrap{display:flex;justify-content:center}
.logo{display:flex;align-items:center;justify-content:center;gap:9px;color:#fff;text-decoration:none;letter-spacing:4px}
.logo-icon{width:34px;height:34px;border-radius:9px;box-shadow:0 0 24px #fff1}
.logo span{line-height:1}
@media(max-width:800px){
  .quick-actions{position:absolute;right:max(6px,env(safe-area-inset-right));top:max(5px,env(safe-area-inset-top));z-index:30;margin:0;width:auto;gap:4px}
  .quick-btn,.pwa-install{width:auto;min-height:32px;height:32px;padding:0 9px;border-radius:9px;font-size:9px}
  .pwa-install svg{width:13px;height:13px}
  .pwa-install span{display:none}
  .logo-wrap{position:absolute;top:max(5px,env(safe-area-inset-top));left:0;right:0;z-index:20}
  .logo{font-size:clamp(14px,4.2vw,21px);letter-spacing:2.5px}
  .logo-icon{width:clamp(24px,7vw,32px);height:clamp(24px,7vw,32px)}
}
@media(orientation:landscape) and (max-height:650px){
  .quick-actions{position:static;display:flex;margin-top:5px}
  .quick-btn,.pwa-install{min-height:32px;height:32px;font-size:9px}
  .logo-wrap{position:static}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
 
/* Accessible light theme */
body.void-light{background:#eef1f5;color:#111}
body.void-light .panel{background:linear-gradient(145deg,#fff,#e8ebf0);border-color:#cbd2dc;box-shadow:0 10px 30px rgba(0,0,0,.08)}
body.void-light .label{color:#596575}
body.void-light .value,body.void-light .logo,body.void-light .quick-btn{color:#111}
body.void-light .quick-btn{background:#fff;border-color:#cbd2dc}
body.void-light #gameCanvas{background:#f8f9fb;border-color:#b9c1cc}
body.void-light .upgrade-hud .best{background:#f3f5f8;border-color:#cbd2dc;color:#596575}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}</style>
</head>


<body>
<div id="srStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<div id="app">

    <div class="game-shell">


        <!-- =================================================
             LEFT PANEL
             ================================================= -->

        <aside class="side left-panel">

            <div class="logo-wrap">
                <a class="logo" href="./" aria-label="VOIDBLOCK home">

<script>

"use strict";

/* =========================================================
   TOUCHSCREEN DETECTION
   =========================================================

   Show the on-screen game controls only when the current
   device actually has touch capability. This supports:
   - Android / iPhone / iPad
   - Touch tablets
   - Windows touchscreen laptops
   - Hybrid 2-in-1 devices

   Normal mouse + keyboard desktops keep the touch controls
   hidden and use the keyboard controls instead.
   ========================================================= */

(function detectTouchscreen() {

    const hasTouchPoints =
        (navigator.maxTouchPoints || 0) > 0 ||
        (navigator.msMaxTouchPoints || 0) > 0;

    const hasTouchMedia =
        window.matchMedia &&
        (window.matchMedia("(pointer: coarse)").matches ||
         window.matchMedia("(any-pointer: coarse)").matches);

    const touchAvailable =
        hasTouchPoints || hasTouchMedia ||
        ("ontouchstart" in window);

    document.documentElement.classList.toggle(
        "touch-device",
        touchAvailable
    );

    document.documentElement.classList.toggle(
        "non-touch",
        !touchAvailable
    );

})();


/* =========================================================
   VOIDBLOCK
   =========================================================

   CONTROLS

   KEYBOARD:

   LEFT ARROW  = MOVE LEFT
   RIGHT ARROW = MOVE RIGHT
   DOWN ARROW  = SOFT DROP

   X = ROTATE CLOCKWISE
   Z = ROTATE COUNTER-CLOCKWISE

   SPACE = HARD DROP
   C = HOLD
   P = PAUSE
   R = RESTART
   ESC = PAUSE / EXIT

   IMPORTANT:

   ARROW UP IS NOT USED FOR ROTATION.


   TOUCH:

   TAP BOARD = ROTATE CLOCKWISE

   SWIPE LEFT  = MOVE LEFT
   SWIPE RIGHT = MOVE RIGHT
   SWIPE DOWN  = SOFT DROP
   SWIPE UP    = HARD DROP

   ON-SCREEN ↻ BUTTON = ROTATE


   NO DATABASE
   NO LOCALSTORAGE
   NO BACKEND
   NO LOGIN

   ========================================================= */


/* =========================================================
   CONSTANTS
   ========================================================= */

const COLS = 10;

const ROWS = 20;


/* =========================================================
   CANVAS
   ========================================================= */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


const nextCanvas =
    document.getElementById(
        "nextCanvas"
    );

const nextCtx =
    nextCanvas.getContext("2d");


const holdCanvas =
    document.getElementById(
        "holdCanvas"
    );

const holdCtx =
    holdCanvas.getContext("2d");


/* =========================================================
   UI
   ========================================================= */

const scoreEl =
    document.getElementById(
        "score"
    );

const levelEl =
    document.getElementById(
        "level"
    );

const linesEl =
    document.getElementById(
        "lines"
    );


/* =========================================================
   OVERLAY
   ========================================================= */

const overlay =
    document.getElementById(
        "overlay"
    );

const overlayTitle =
    document.getElementById(
        "overlayTitle"
    );

const overlayText =
    document.getElementById(
        "overlayText"
    );

const playBtn =
    document.getElementById(
        "playBtn"
    );

const resumeBtn =
    document.getElementById(
        "resumeBtn"
    );

const restartBtn =
    document.getElementById(
        "restartBtn"
    );

const exitBtn =
    document.getElementById(
        "exitBtn"
    );


/* =========================================================
   GAME CONTROLS
   ========================================================= */

const leftBtn =
    document.getElementById(
        "leftBtn"
    );

const rotateBtn =
    document.getElementById(
        "rotateBtn"
    );

const rightBtn =
    document.getElementById(
        "rightBtn"
    );

const dropBtn =
    document.getElementById(
        "dropBtn"
    );

const holdBtn =
    document.getElementById(
        "holdBtn"
    );

const pauseBtn =
    document.getElementById(
        "pauseBtn"
    );

const gameExitBtn =
    document.getElementById(
        "gameExitBtn"
    );

const musicBtn = document.getElementById("musicBtn");
const musicFile = document.getElementById("musicFile");
const musicVolume = document.getElementById("musicVolume");
const musicTrack = document.getElementById("musicTrack");
const music = new Audio();
music.loop = true;
music.preload = "metadata";
music.volume = Number(musicVolume.value);


/* =========================================================
   GAME STATE
   ========================================================= */

let board;

let current;

let nextPiece;

let holdPiece = null;

let canHold = true;

let bag = [];

let musicObjectUrl = null;

let musicEnabled = false;

let score = 0;
let combo = -1;
let backToBack = false;
let lastClearScore = 0;

let level = 1;

let lines = 0;

let running = false;

let paused = false;

let dropTimer = 0;

let lastTime = 0;

let animationFrameId = null;


/* =========================================================
   COLORS
   ========================================================= */

const COLORS = [

    null,

    "#00e5ff",

    "#ffe600",

    "#b45cff",

    "#4cff6a",

    "#ff4757",

    "#4d7cff",

    "#ff9f43"

];


/* =========================================================
   TETROMINOES
   ========================================================= */

const PIECES = [


    /* I */

    [
        [1,1,1,1]
    ],


    /* O */

    [
        [2,2],
        [2,2]
    ],


    /* T */

    [
        [0,3,0],
        [3,3,3]
    ],


    /* S */

    [
        [0,4,4],
        [4,4,0]
    ],


    /* Z */

    [
        [5,5,0],
        [0,5,5]
    ],


    /* J */

    [
        [6,0,0],
        [6,6,6]
    ],


    /* L */

    [
        [0,0,7],
        [7,7,7]
    ]

];


/* =========================================================
   BOARD
   ========================================================= */

function createBoard() {

    return Array.from(
        {
            length: ROWS
        },

        () =>
            Array(
                COLS
            ).fill(0)
    );
}


/* =========================================================
   CLONE MATRIX
   ========================================================= */

function cloneMatrix(matrix) {

    return matrix.map(
        row => [...row]
    );
}


/* =========================================================
   RANDOM PIECE
   ========================================================= */

function refillBag() {
    bag = PIECES.map((_, index) => index);
    for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
    }
}

function randomPiece() {

    if (!bag.length) refillBag();

    const matrix =
        cloneMatrix(
            PIECES[
                bag.pop()
            ]
        );


    return {

        matrix,

        x:
            Math.floor(
                (
                    COLS -
                    matrix[0].length
                ) / 2
            ),

        y: 0

    };
}


/* =========================================================
   RESET GAME
   ========================================================= */

function resetGame() {

    board =
        createBoard();


    score = 0;
    combo = -1;
    backToBack = false;
    lastClearScore = 0;

    level = 1;

    lines = 0;


    holdPiece = null;

    canHold = true;

    bag = [];

    refillBag();


    current =
        randomPiece();


    nextPiece =
        randomPiece();


    dropTimer = 0;


    updateUI();

    drawSidePieces();

    draw();
}


/* =========================================================
   COLLISION
   ========================================================= */

function collide(
    piece,
    offsetX = 0,
    offsetY = 0,
    matrix = piece.matrix
) {

    for (
        let y = 0;
        y < matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < matrix[y].length;
            x++
        ) {

            if (
                !matrix[y][x]
            ) {
                continue;
            }


            const bx =
                piece.x +
                x +
                offsetX;


            const by =
                piece.y +
                y +
                offsetY;


            if (
                bx < 0 ||
                bx >= COLS ||
                by >= ROWS
            ) {

                return true;
            }


            if (
                by >= 0 &&
                board[by][bx]
            ) {

                return true;
            }

        }
    }


    return false;
}


/* =========================================================
   MERGE
   ========================================================= */

function merge() {

    for (
        let y = 0;
        y < current.matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < current.matrix[y].length;
            x++
        ) {

            if (
                !current.matrix[y][x]
            ) {
                continue;
            }


            const by =
                current.y + y;


            const bx =
                current.x + x;


            if (
                by >= 0 &&
                by < ROWS &&
                bx >= 0 &&
                bx < COLS
            ) {

                board[by][bx] =
                    current.matrix[y][x];
            }

        }
    }
}


/* =========================================================
   CLEAR LINES
   ========================================================= */

function clearLines() {

    let cleared = 0;

    for (
        let y = ROWS - 1;
        y >= 0;
        y--
    ) {
        if (board[y].every(Boolean)) {
            board.splice(y, 1);
            board.unshift(Array(COLS).fill(0));
            cleared++;
            y++;
        }
    }

    /*
       SCORING SYSTEM

       1 line  = 100 × level
       2 lines = 300 × level
       3 lines = 500 × level
       4 lines = 800 × level

       A 4-line clear (TETRIS) keeps the
       back-to-back bonus alive.

       Consecutive line-clearing drops build
       a combo bonus. The combo starts after
       the second consecutive clear.
    */
    if (cleared > 0) {
        const base = [0, 100, 300, 500, 800][cleared];

        combo++;

        let points = base * level;

        // Back-to-back TETRIS bonus: +50%.
        if (cleared === 4) {
            if (backToBack) {
                points = Math.floor(points * 1.5);
            }
            backToBack = true;
        } else {
            backToBack = false;
        }

        // Combo bonus: +50 × combo × level.
        if (combo > 0) {
            points += 50 * combo * level;
        }

        score += points;
        lastClearScore = points;
        lines += cleared;

        level =
            Math.floor(lines / 10) + 1;

        updateUI();
    } else {
        /*
           A piece that clears no lines breaks
           the combo, but does not affect the score.
        */
        combo = -1;
        lastClearScore = 0;
    }
}


/* =========================================================
   SPAWN NEXT
   ========================================================= */

function spawnNext() {

    current =
        nextPiece;


    current.x =
        Math.floor(
            (
                COLS -
                current.matrix[0].length
            ) / 2
        );


    current.y = 0;


    nextPiece =
        randomPiece();


    canHold = true;


    drawSidePieces();


    if (
        collide(current)
    ) {

        gameOver();
    }
}


/* =========================================================
   MOVE
   ========================================================= */

function move(dx) {

    if (
        !running ||
        paused
    ) {
        return;
    }


    if (
        !collide(
            current,
            dx,
            0
        )
    ) {

        current.x += dx;

        draw();
    }
}


/* =========================================================
   SOFT DROP
   ========================================================= */

function softDrop() {

    if (
        !running ||
        paused
    ) {
        return;
    }


    if (
        !collide(
            current,
            0,
            1
        )
    ) {

        current.y++;

        // Soft drop: 1 point per manually dropped cell.
        score += 1;

    } else {

        lockPiece();
    }


    updateUI();

    draw();
}


/* =========================================================
   HARD DROP
   ========================================================= */

function hardDrop() {

    if (
        !running ||
        paused
    ) {
        return;
    }


    let distance = 0;


    while (
        !collide(
            current,
            0,
            1
        )
    ) {

        current.y++;

        distance++;
    }


    // Hard drop: 2 points per cell.
    score +=
        distance * 2;


    lockPiece();


    updateUI();

    draw();
}


/* =========================================================
   LOCK
   ========================================================= */

function lockPiece() {

    merge();

    clearLines();

    spawnNext();
}


/* =========================================================
   ROTATE CLOCKWISE
   ========================================================= */

function rotateMatrix(matrix) {

    return matrix[0].map(
        (_, index) =>
            matrix
                .map(
                    row =>
                        row[index]
                )
                .reverse()
    );
}


function rotate() {

    if (
        !running ||
        paused
    ) {
        return;
    }


    const oldMatrix =
        cloneMatrix(
            current.matrix
        );


    const oldX =
        current.x;


    const rotated =
        rotateMatrix(
            current.matrix
        );


    current.matrix =
        rotated;


    /*
       Normal position.
    */

    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Wall kick right.
    */

    current.x =
        oldX + 1;


    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Wall kick left.
    */

    current.x =
        oldX - 1;


    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Larger wall kick.
    */

    current.x =
        oldX - 2;


    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Restore.
    */

    current.x =
        oldX;


    current.matrix =
        oldMatrix;


    draw();
}


/* =========================================================
   ROTATE COUNTER-CLOCKWISE
   ========================================================= */

function rotateCounterClockwise() {

    if (
        !running ||
        paused
    ) {
        return;
    }


    const oldMatrix =
        cloneMatrix(
            current.matrix
        );


    const oldX =
        current.x;


    /*
       Three clockwise rotations
       produce one counter-clockwise
       rotation.
    */

    let rotated =
        rotateMatrix(
            current.matrix
        );


    rotated =
        rotateMatrix(
            rotated
        );


    rotated =
        rotateMatrix(
            rotated
        );


    current.matrix =
        rotated;


    /*
       Normal position.
    */

    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Wall kick right.
    */

    current.x =
        oldX + 1;


    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Wall kick left.
    */

    current.x =
        oldX - 1;


    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Larger wall kick.
    */

    current.x =
        oldX - 2;


    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Restore.
    */

    current.x =
        oldX;


    current.matrix =
        oldMatrix;


    draw();
}


/* =========================================================
   HOLD
   ========================================================= */

function hold() {

    if (
        !running ||
        paused ||
        !canHold
    ) {
        return;
    }


    if (
        !holdPiece
    ) {

        holdPiece =
            current;


        current =
            nextPiece;


        nextPiece =
            randomPiece();

    } else {

        const temp =
            holdPiece;


        holdPiece =
            current;


        current =
            temp;
    }


    current.x =
        Math.floor(
            (
                COLS -
                current.matrix[0].length
            ) / 2
        );


    current.y = 0;


    canHold = false;


    drawSidePieces();

    draw();
}


/* =========================================================
   GHOST
   ========================================================= */

function getGhostY() {

    let distance = 0;


    while (
        !collide(
            current,
            0,
            distance + 1
        )
    ) {

        distance++;
    }


    return current.y + distance;
}


/* =========================================================
   RESIZE
   ========================================================= */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.max(
            1,
            Math.floor(
                rect.width * dpr
            )
        );


    canvas.height =
        Math.max(
            1,
            Math.floor(
                rect.height * dpr
            )
        );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    draw();
}


/* =========================================================
   DRAW BLOCK
   ========================================================= */

function drawBlock(
    context,
    x,
    y,
    size,
    value,
    alpha = 1
) {

    const color =
        COLORS[value];


    context.save();


    context.globalAlpha =
        alpha;


    const px =
        x + 2;


    const py =
        y + 2;


    const s =
        size - 4;


    /*
       Shadow.
    */

    context.fillStyle =
        "rgba(0,0,0,.45)";


    context.fillRect(
        px + 3,
        py + 5,
        s,
        s
    );


    /*
       Main block.
    */

    context.fillStyle =
        color;


    context.fillRect(
        px,
        py,
        s,
        s
    );


    /*
       Gradient.
    */

    const gradient =
        context.createLinearGradient(
            px,
            py,
            px,
            py + s
        );


    gradient.addColorStop(
        0,
        "rgba(255,255,255,.55)"
    );


    gradient.addColorStop(
        .15,
        "rgba(255,255,255,.12)"
    );


    gradient.addColorStop(
        .55,
        "rgba(0,0,0,.05)"
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,.38)"
    );


    context.fillStyle =
        gradient;


    context.fillRect(
        px,
        py,
        s,
        s
    );


    /*
       Border.
    */

    context.strokeStyle =
        "rgba(255,255,255,.28)";


    context.lineWidth = 1;


    context.strokeRect(
        px + .5,
        py + .5,
        s - 1,
        s - 1
    );


    context.restore();
}


/* =========================================================
   DRAW
   ========================================================= */

function draw() {

    if (
        !board
    ) {
        return;
    }


    const rect =
        canvas.getBoundingClientRect();


    const width =
        rect.width;


    const height =
        rect.height;


    if (
        width <= 0 ||
        height <= 0
    ) {
        return;
    }


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const cellW =
        width / COLS;


    const cellH =
        height / ROWS;


    /*
       Background.
    */

    ctx.fillStyle =
        "#080b11";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
       Grid.
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.035)";


    ctx.lineWidth = 1;


    for (
        let x = 0;
        x <= COLS;
        x++
    ) {

        ctx.beginPath();


        ctx.moveTo(
            x * cellW,
            0
        );


        ctx.lineTo(
            x * cellW,
            height
        );


        ctx.stroke();
    }


    for (
        let y = 0;
        y <= ROWS;
        y++
    ) {

        ctx.beginPath();


        ctx.moveTo(
            0,
            y * cellH
        );


        ctx.lineTo(
            width,
            y * cellH
        );


        ctx.stroke();
    }


    /*
       Existing blocks.
    */

    for (
        let y = 0;
        y < ROWS;
        y++
    ) {

        for (
            let x = 0;
            x < COLS;
            x++
        ) {

            if (
                board[y][x]
            ) {

                drawBlock(
                    ctx,

                    x * cellW,

                    y * cellH,

                    Math.min(
                        cellW,
                        cellH
                    ),

                    board[y][x]
                );
            }
        }
    }


    if (
        !current
    ) {
        return;
    }


    /*
       Ghost piece.
    */

    const ghostY =
        getGhostY();


    for (
        let y = 0;
        y < current.matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < current.matrix[y].length;
            x++
        ) {

            if (
                current.matrix[y][x]
            ) {

                drawBlock(
                    ctx,

                    (
                        current.x +
                        x
                    ) * cellW,

                    (
                        ghostY +
                        y
                    ) * cellH,

                    Math.min(
                        cellW,
                        cellH
                    ),

                    current.matrix[y][x],

                    .16
                );
            }
        }
    }


    /*
       Current piece.
    */

    for (
        let y = 0;
        y < current.matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < current.matrix[y].length;
            x++
        ) {

            if (
                current.matrix[y][x]
            ) {

                drawBlock(
                    ctx,

                    (
                        current.x +
                        x
                    ) * cellW,

                    (
                        current.y +
                        y
                    ) * cellH,

                    Math.min(
                        cellW,
                        cellH
                    ),

                    current.matrix[y][x]
                );
            }
        }
    }
}


/* =========================================================
   MINI PIECES
   ========================================================= */

function drawMini(
    context,
    canvasElement,
    piece
) {

    const rect =
        canvasElement.getBoundingClientRect();


    if (
        rect.width <= 0 ||
        rect.height <= 0
    ) {
        return;
    }


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvasElement.width =
        Math.max(
            1,
            Math.floor(
                rect.width * dpr
            )
        );


    canvasElement.height =
        Math.max(
            1,
            Math.floor(
                rect.height * dpr
            )
        );


    context.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    context.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );


    if (
        !piece
    ) {
        return;
    }


    const matrix =
        piece.matrix;


    const size =
        Math.min(
            rect.width / 5,
            rect.height / 4
        );


    const totalW =
        matrix[0].length * size;


    const totalH =
        matrix.length * size;


    const startX =
        (
            rect.width -
            totalW
        ) / 2;


    const startY =
        (
            rect.height -
            totalH
        ) / 2;


    for (
        let y = 0;
        y < matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < matrix[y].length;
            x++
        ) {

            if (
                matrix[y][x]
            ) {

                drawBlock(
                    context,

                    startX +
                    x * size,

                    startY +
                    y * size,

                    size,

                    matrix[y][x]
                );
            }
        }
    }
}


/* =========================================================
   DRAW SIDE PIECES
   ========================================================= */

function drawSidePieces() {

    drawMini(
        nextCtx,
        nextCanvas,
        nextPiece
    );


    drawMini(
        holdCtx,
        holdCanvas,
        holdPiece
    );
}

   MAIN MENU
   ========================================================= */

/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver() {

    running = false;

    paused = false;


    cancelGameLoop();


    showGameOverMenu();
}


/* =========================================================
   START GAME
   ========================================================= */

function startGame() {

    cancelGameLoop();


    resetGame();


    running = true;

    paused = false;


    hideOverlay();


    lastTime =
        performance.now();


    dropTimer = 0;


    startGameLoop();
}


/* =========================================================
   RESTART GAME
   ========================================================= */

function restartGame() {

    cancelGameLoop();


    resetGame();


    running = true;

    paused = false;


    hideOverlay();


    lastTime =
        performance.now();


    dropTimer = 0;


    startGameLoop();
}


/* =========================================================
   PAUSE
   ========================================================= */

function pauseGame() {

    if (
        !running ||
        paused
    ) {
        return;
    }


    paused = true;


    cancelGameLoop();


    showPauseMenu();
}


/* =========================================================
   RESUME
   ========================================================= */

function resumeGame() {

    if (
        !running ||
        !paused
    ) {
        return;
    }


    paused = false;


    hideOverlay();


    lastTime =
        performance.now();


    dropTimer = 0;


    startGameLoop();
}


/* =========================================================
   TOGGLE PAUSE
   ========================================================= */

function togglePause() {

    if (
        !running
    ) {
        return;
    }


    if (
        paused
    ) {

        resumeGame();

    } else {

        pauseGame();
    }
}


/* =========================================================
   EXIT
   ========================================================= */

function exitGame() {

    cancelGameLoop();


    running = false;

    paused = false;


    /*
       Clear all in-memory game data.
    */

    board =
        createBoard();


    current = null;

    nextPiece = null;

    holdPiece = null;

    canHold = true;


    score = 0;

    level = 1;

    lines = 0;

    dropTimer = 0;


    updateUI();

    drawSidePieces();


    showMainMenu();


    draw();
}


/* =========================================================
   GAME LOOP CONTROL
   ========================================================= */

function cancelGameLoop() {

    if (
        animationFrameId !== null
    ) {

        cancelAnimationFrame(
            animationFrameId
        );


        animationFrameId = null;
    }
}


function startGameLoop() {

    cancelGameLoop();


    animationFrameId =
        requestAnimationFrame(
            loop
        );
}


/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(time) {

    animationFrameId = null;


    if (
        !running ||
        paused
    ) {

        return;
    }


    const delta =
        time - lastTime;


    lastTime =
        time;


    dropTimer += delta;


    const speed =
        Math.max(
            80,

            800 -
            (
                level - 1
            ) * 65
        );


    if (
        dropTimer >= speed
    ) {

        dropTimer = 0;


        if (
            !collide(
                current,
                0,
                1
            )
        ) {

            current.y++;

        } else {

            lockPiece();
        }
    }


    draw();


    if (
        running &&
        !paused
    ) {

        animationFrameId =
            requestAnimationFrame(
                loop
            );
    }
}


/* =========================================================
   MUSIC
   ========================================================= */

function setMusicLabel(text) {
    if (musicTrack) musicTrack.textContent = text;
}

async function toggleMusic(force) {
    if (!music.src) {
        setMusicLabel("LOAD A TRACK FIRST");
        return;
    }

    const next = typeof force === "boolean" ? force : !musicEnabled;

    if (next) {
        try {
            await music.play();
            musicEnabled = true;
            musicBtn.textContent = "Ⅱ MUSIC";
        } catch {
            setMusicLabel("PRESS MUSIC TO START");
        }
    } else {
        music.pause();
        musicEnabled = false;
        musicBtn.textContent = "♫ MUSIC";
    }
}

musicBtn?.addEventListener("click", () => toggleMusic());

musicVolume?.addEventListener("input", () => {
    music.volume = Number(musicVolume.value);
});

musicFile?.addEventListener("change", event => {
    const file = event.target.files?.[0];
    if (!file) return;

    if (musicObjectUrl) URL.revokeObjectURL(musicObjectUrl);

    musicObjectUrl = URL.createObjectURL(file);
    music.src = musicObjectUrl;
    music.load();
    setMusicLabel(file.name);
    toggleMusic(true);
});

music.addEventListener("ended", () => {
    musicEnabled = false;
    if (musicBtn) musicBtn.textContent = "♫ MUSIC";
});

/* =========================================================
   KEYBOARD
   =========================================================

   IMPORTANT:

   ARROW UP DOES NOT ROTATE.

   ROTATION:

   X = CLOCKWISE
   Z = COUNTER-CLOCKWISE

   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
           Prevent browser scrolling.

           ArrowUp is intentionally NOT included
           because it has no game action.
        */

        if (
            [
                "ArrowLeft",
                "ArrowRight",
                "ArrowDown",
                " "
            ].includes(event.key)
        ) {

            event.preventDefault();
        }


        switch (
            event.key
        ) {


            /* LEFT */

            case "ArrowLeft":

                move(-1);

                break;


            /* RIGHT */

            case "ArrowRight":

                move(1);

                break;


            /* SOFT DROP */

            case "ArrowDown":

                softDrop();

                break;


            /* =========================================
               ROTATE CLOCKWISE

               X ONLY
               ========================================= */

            case "x":
            case "X":

                event.preventDefault();

                rotate();

                break;


            /* =========================================
               ROTATE COUNTER-CLOCKWISE

               Z ONLY
               ========================================= */

            case "z":
            case "Z":

                event.preventDefault();

                rotateCounterClockwise();

                break;


            /* HARD DROP */

            case " ":

                hardDrop();

                break;


            /* HOLD */

            case "c":
            case "C":

                hold();

                break;


            /* PAUSE */

            case "p":
            case "P":

                togglePause();

                break;


            /* RESTART */

            case "r":
            case "R":

                if (
                    running
                ) {

                    restartGame();

                } else {

                    startGame();
                }

                break;


            /* ESCAPE */

            case "Escape":

                if (
                    running
                ) {

                    if (
                        paused
                    ) {

                        exitGame();

                    } else {

                        pauseGame();
                    }
                }

                break;
        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH / POINTER CONTROLS
   =========================================================

   TAP
   = ROTATE CLOCKWISE

   SWIPE LEFT
   = MOVE LEFT

   SWIPE RIGHT
   = MOVE RIGHT

   SWIPE DOWN
   = SOFT DROP

   SWIPE UP
   = HARD DROP

   Works with:

   Android
   iPhone
   iPad
   Android tablets
   Windows tablets
   Touch laptops

   ========================================================= */

let pointerStartX = 0;

let pointerStartY = 0;

let pointerStartTime = 0;

let pointerActive = false;


/*
   Explicitly disable browser gestures
   on the game board.
*/

canvas.style.touchAction =
    "none";


/* =========================================================
   POINTER DOWN
   ========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        /*
           Ignore right mouse button.
        */

        if (
            event.pointerType === "mouse" &&
            event.button !== 0
        ) {

            return;
        }


        pointerActive = true;


        pointerStartX =
            event.clientX;


        pointerStartY =
            event.clientY;


        pointerStartTime =
            performance.now();


        /*
           Keep receiving the pointer
           even if finger moves.
        */

        try {

            canvas.setPointerCapture(
                event.pointerId
            );

        } catch (
            error
        ) {

            /* Older browser:
               ignore. */
        }


        event.preventDefault();

    },
    {
        passive: false
    }
);


/* =========================================================
   POINTER UP
   ========================================================= */

canvas.addEventListener(
    "pointerup",
    event => {

        if (
            !pointerActive
        ) {

            return;
        }


        pointerActive = false;


        const dx =
            event.clientX -
            pointerStartX;


        const dy =
            event.clientY -
            pointerStartY;


        const duration =
            performance.now() -
            pointerStartTime;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /* ================================================
           TAP

           TAP = ROTATE CLOCKWISE
           ================================================ */

        if (
            distance < 25 &&
            duration < 350
        ) {

            rotate();


            event.preventDefault();


            return;
        }


        /* ================================================
           HORIZONTAL SWIPE
           ================================================ */

        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (
                Math.abs(dx) >= 30
            ) {

                if (
                    dx > 0
                ) {

                    move(1);

                } else {

                    move(-1);
                }
            }

        }


        /* ================================================
           VERTICAL SWIPE
           ================================================ */

        else {

            /*
               Swipe DOWN
               = SOFT DROP
            */

            if (
                dy >= 30
            ) {

                softDrop();
            }


            /*
               Swipe UP
               = HARD DROP
            */

            else if (
                dy <= -30
            ) {

                hardDrop();
            }
        }


        event.preventDefault();

    },
    {
        passive: false
    }
);


/* =========================================================
   POINTER CANCEL
   ========================================================= */

canvas.addEventListener(
    "pointercancel",
    () => {

        pointerActive = false;

    },
    {
        passive: true
    }
);


/* =========================================================
   PREVENT CONTEXT MENU ON GAME BOARD
   ========================================================= */

canvas.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        resizeCanvas();

        drawSidePieces();

    }
);


/* =========================================================
   ORIENTATION CHANGE
   ========================================================= */

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            () => {

                resizeCanvas();

                drawSidePieces();

            },
            100
        );
    }
);

/* =========================================================
   RESPONSIVE VIEWPORT RESIZE
   Handles mobile browser address bars, tablets and
   dynamic viewport changes more reliably.
   ========================================================= */

if (window.visualViewport) {
    window.visualViewport.addEventListener(
        "resize",
        () => {
            requestAnimationFrame(() => {
                resizeCanvas();
                drawSidePieces();
            });
        }
    );
}

if ("ResizeObserver" in window) {
    const boardObserver = new ResizeObserver(() => {
        resizeCanvas();
    });

    boardObserver.observe(
        document.querySelector(".board-wrap")
    );
}

   INITIALIZE
   ========================================================= */

resetGame();


resizeCanvas();


draw();


/*
   Start at main menu.
*/

showMainMenu();

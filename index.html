<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VOIDBLOCK — Realistic Tetris</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070b;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

button {
    border: 0;
    color: white;
    background: #151a24;
    border-radius: 12px;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    font-weight: 700;
}

button:active {
    transform: scale(.94);
}

button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
}

/* =========================================================
   APP
   ========================================================= */

#app {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
}

.game-shell {
    width: min(1100px, 100%);
    height: min(900px, 100%);
    display: grid;
    grid-template-columns: 180px minmax(280px, 430px) 180px;
    gap: 22px;
    align-items: center;
    justify-content: center;
}

/* =========================================================
   SIDE PANELS
   ========================================================= */

.side {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.logo {
    font-size: 26px;
    letter-spacing: 5px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 8px;
}

.panel {
    background: linear-gradient(145deg, #111722, #090c12);
    border: 1px solid #252d3a;
    border-radius: 16px;
    padding: 14px;
    box-shadow:
        inset 0 1px rgba(255,255,255,.04),
        0 10px 30px rgba(0,0,0,.3);
}

.label {
    color: #7e899b;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 6px;
}

.value {
    font-size: 25px;
    font-weight: 900;
}

#nextCanvas,
#holdCanvas {
    width: 100%;
    height: 100px;
    display: block;
}

/* =========================================================
   BOARD
   ========================================================= */

.board-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 10 / 20;
    max-height: 82vh;
    margin: auto;
}

#gameCanvas {
    width: 100%;
    height: 100%;
    display: block;
    background: #080b11;
    border: 2px solid #293342;
    border-radius: 14px;
    box-shadow:
        0 0 50px rgba(0,0,0,.65),
        inset 0 0 30px rgba(0,0,0,.5);
    touch-action: none;
}

/* =========================================================
   OVERLAY / MENU
   ========================================================= */

.overlay {
    position: absolute;
    inset: 2px;
    border-radius: 12px;
    background: rgba(3,5,9,.86);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    z-index: 10;
    padding: 20px;
}

.overlay.hidden {
    display: none;
}

.overlay h1 {
    font-size: clamp(28px, 7vw, 52px);
    letter-spacing: 6px;
}

.overlay p {
    color: #8994a7;
    min-height: 20px;
}

.overlay-actions {
    width: min(230px, 85%);
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.overlay-btn {
    width: 100%;
    min-height: 48px;
    font-size: 14px;
    letter-spacing: 1px;
}

.primary {
    background: #fff;
    color: #05070b;
}

.secondary {
    background: #151a24;
    border: 1px solid #303a4a;
}

.danger {
    background: #35161b;
    border: 1px solid #7d3039;
}

.hidden-btn {
    display: none !important;
}

/* =========================================================
   CONTROLS
   ========================================================= */

.controls {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.control-row {
    display: flex;
    gap: 9px;
}

.control {
    flex: 1;
    min-height: 54px;
    font-size: 19px;
    border: 1px solid #293342;
}

.rotate {
    background: #222b3a;
}

.drop {
    width: 100%;
    min-height: 58px;
    background: #f0f2f5;
    color: #05070b;
}

.action {
    width: 100%;
    min-height: 44px;
}

.exit-action {
    background: #35161b;
    border: 1px solid #6b2a32;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 800px) {

    body {
        overflow: hidden;
    }

    #app {
        padding: 6px;
    }

    .game-shell {
        height: 100%;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 6px;
    }

    .side {
        display: contents;
    }

    .left-panel {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 5;
    }

    .right-panel {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 5;
    }

    .logo {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        font-size: 18px;
        letter-spacing: 3px;
    }

    .panel {
        background: rgba(8,11,17,.8);
        padding: 8px 10px;
        border-radius: 10px;
    }

    .label {
        font-size: 8px;
        margin-bottom: 2px;
    }

    .value {
        font-size: 17px;
    }

    #nextCanvas,
    #holdCanvas {
        display: none;
    }

    .board-wrap {
        width: min(94vw, 52vh);
        max-height: none;
        align-self: center;
        justify-self: center;
        margin-top: 4px;
    }

    .controls {
        width: min(96vw, 430px);
        margin: auto;
        padding-bottom: max(5px, env(safe-area-inset-bottom));
    }

    .control {
        min-height: 52px;
    }

    .action {
        min-height: 42px;
    }
}

/* =========================================================
   LANDSCAPE PHONE
   ========================================================= */

@media (max-height: 520px) and (orientation: landscape) {

    #app {
        padding: 4px;
    }

    .game-shell {
        display: grid;
        grid-template-columns: 100px minmax(180px, 300px) 100px;
        grid-template-rows: 1fr;
        gap: 8px;
    }

    .logo {
        display: none;
    }

    .left-panel,
    .right-panel {
        position: static;
    }

    .controls {
        position: absolute;
        bottom: 5px;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
    }

    .board-wrap {
        width: min(42vh, 300px);
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="game-shell">

        <!-- =================================================
             LEFT PANEL
             ================================================= -->

        <aside class="side left-panel">

            <div class="logo">VOIDBLOCK</div>

            <div class="panel">
                <div class="label">HOLD</div>
                <canvas id="holdCanvas"></canvas>
            </div>

            <div class="panel">
                <div class="label">SCORE</div>
                <div class="value" id="score">0</div>
            </div>

            <div class="panel">
                <div class="label">LEVEL</div>
                <div class="value" id="level">1</div>
            </div>

        </aside>


        <!-- =================================================
             GAME BOARD
             ================================================= -->

        <main class="board-wrap">

            <canvas id="gameCanvas"></canvas>

            <!-- MAIN MENU / PAUSE / GAME OVER -->

            <div id="overlay" class="overlay">

                <h1 id="overlayTitle">
                    VOIDBLOCK
                </h1>

                <p id="overlayText">
                    READY?
                </p>

                <div class="overlay-actions">

                    <!-- Main menu -->
                    <button
                        class="overlay-btn primary"
                        id="playBtn">
                        PLAY
                    </button>

                    <!-- Pause -->
                    <button
                        class="overlay-btn primary hidden-btn"
                        id="resumeBtn">
                        RESUME
                    </button>

                    <!-- Restart -->
                    <button
                        class="overlay-btn secondary hidden-btn"
                        id="restartBtn">
                        RESTART
                    </button>

                    <!-- Exit -->
                    <button
                        class="overlay-btn danger hidden-btn"
                        id="exitBtn">
                        EXIT
                    </button>

                </div>

            </div>

        </main>


        <!-- =================================================
             RIGHT PANEL
             ================================================= -->

        <aside class="side right-panel">

            <div class="panel">
                <div class="label">NEXT</div>
                <canvas id="nextCanvas"></canvas>
            </div>

            <div class="panel">
                <div class="label">LINES</div>
                <div class="value" id="lines">0</div>
            </div>

            <div class="controls">

                <div class="control-row">

                    <button
                        class="control"
                        id="leftBtn">
                        ◀
                    </button>

                    <button
                        class="control rotate"
                        id="rotateBtn">
                        ↻
                    </button>

                    <button
                        class="control"
                        id="rightBtn">
                        ▶
                    </button>

                </div>

                <button
                    class="drop"
                    id="dropBtn">
                    HARD DROP
                </button>

                <button
                    class="action"
                    id="holdBtn">
                    HOLD
                </button>

                <button
                    class="action"
                    id="pauseBtn">
                    PAUSE
                </button>

                <!-- DIRECT EXIT BUTTON -->
                <button
                    class="action exit-action"
                    id="gameExitBtn">
                    EXIT
                </button>

            </div>

        </aside>

    </div>

</div>


<script>
"use strict";

/* =========================================================
   VOIDBLOCK
   Static Tetris-style game

   NO DATABASE
   NO LOCALSTORAGE
   NO LOGIN
   NO BACKEND

   GAME STATES:

   MAIN MENU
   PLAYING
   PAUSED
   GAME OVER

   Buttons:

   PLAY
   PAUSE
   RESUME
   RESTART
   EXIT
   ========================================================= */


/* =========================================================
   CONSTANTS
   ========================================================= */

const COLS = 10;
const ROWS = 20;


/* =========================================================
   CANVAS
   ========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const nextCanvas =
    document.getElementById("nextCanvas");

const nextCtx =
    nextCanvas.getContext("2d");

const holdCanvas =
    document.getElementById("holdCanvas");

const holdCtx =
    holdCanvas.getContext("2d");


/* =========================================================
   UI
   ========================================================= */

const scoreEl =
    document.getElementById("score");

const levelEl =
    document.getElementById("level");

const linesEl =
    document.getElementById("lines");


/* Overlay */

const overlay =
    document.getElementById("overlay");

const overlayTitle =
    document.getElementById("overlayTitle");

const overlayText =
    document.getElementById("overlayText");

const playBtn =
    document.getElementById("playBtn");

const resumeBtn =
    document.getElementById("resumeBtn");

const restartBtn =
    document.getElementById("restartBtn");

const exitBtn =
    document.getElementById("exitBtn");


/* Game controls */

const pauseBtn =
    document.getElementById("pauseBtn");

const gameExitBtn =
    document.getElementById("gameExitBtn");


/* =========================================================
   GAME STATE
   ========================================================= */

let board;

let current;

let nextPiece;

let holdPiece = null;

let canHold = true;

let score = 0;

let level = 1;

let lines = 0;

let running = false;

let paused = false;

let dropTimer = 0;

let lastTime = 0;

let animationFrameId = null;


/* =========================================================
   COLORS
   ========================================================= */

const COLORS = [
    null,

    "#00e5ff", // I
    "#ffe600", // O
    "#b45cff", // T
    "#4cff6a", // S
    "#ff4757", // Z
    "#4d7cff", // J
    "#ff9f43"  // L
];


/* =========================================================
   TETROMINOES
   ========================================================= */

const PIECES = [

    [
        [1,1,1,1]
    ],

    [
        [2,2],
        [2,2]
    ],

    [
        [0,3,0],
        [3,3,3]
    ],

    [
        [0,4,4],
        [4,4,0]
    ],

    [
        [5,5,0],
        [0,5,5]
    ],

    [
        [6,0,0],
        [6,6,6]
    ],

    [
        [0,0,7],
        [7,7,7]
    ]

];


/* =========================================================
   BOARD
   ========================================================= */

function createBoard() {

    return Array.from(
        { length: ROWS },
        () => Array(COLS).fill(0)
    );
}


/* =========================================================
   MATRIX
   ========================================================= */

function cloneMatrix(matrix) {

    return matrix.map(
        row => [...row]
    );
}


/* =========================================================
   RANDOM PIECE
   ========================================================= */

function randomPiece() {

    const matrix =
        cloneMatrix(
            PIECES[
                Math.floor(
                    Math.random() *
                    PIECES.length
                )
            ]
        );

    return {

        matrix,

        x:
            Math.floor(
                (COLS - matrix[0].length) / 2
            ),

        y: 0

    };
}


/* =========================================================
   RESET GAME
   ========================================================= */

function resetGame() {

    board =
        createBoard();

    score = 0;

    level = 1;

    lines = 0;

    holdPiece = null;

    canHold = true;

    current =
        randomPiece();

    nextPiece =
        randomPiece();

    dropTimer = 0;

    updateUI();

    drawSidePieces();

    draw();
}


/* =========================================================
   COLLISION
   ========================================================= */

function collide(
    piece,
    offsetX = 0,
    offsetY = 0,
    matrix = piece.matrix
) {

    for (
        let y = 0;
        y < matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < matrix[y].length;
            x++
        ) {

            if (!matrix[y][x])
                continue;

            const bx =
                piece.x +
                x +
                offsetX;

            const by =
                piece.y +
                y +
                offsetY;


            if (
                bx < 0 ||
                bx >= COLS ||
                by >= ROWS
            ) {

                return true;
            }


            if (
                by >= 0 &&
                board[by][bx]
            ) {

                return true;
            }

        }

    }

    return false;
}


/* =========================================================
   MERGE
   ========================================================= */

function merge() {

    for (
        let y = 0;
        y < current.matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < current.matrix[y].length;
            x++
        ) {

            if (!current.matrix[y][x])
                continue;

            const by =
                current.y + y;

            const bx =
                current.x + x;

            if (by >= 0) {

                board[by][bx] =
                    current.matrix[y][x];
            }

        }

    }
}


/* =========================================================
   CLEAR LINES
   ========================================================= */

function clearLines() {

    let cleared = 0;

    for (
        let y = ROWS - 1;
        y >= 0;
        y--
    ) {

        if (
            board[y].every(Boolean)
        ) {

            board.splice(y, 1);

            board.unshift(
                Array(COLS).fill(0)
            );

            cleared++;

            y++;
        }
    }


    if (cleared > 0) {

        const points = [
            0,
            100,
            300,
            500,
            800
        ];

        score +=
            points[cleared] *
            level;

        lines += cleared;

        level =
            Math.floor(lines / 10) + 1;

        updateUI();
    }
}


/* =========================================================
   SPAWN NEXT
   ========================================================= */

function spawnNext() {

    current =
        nextPiece;

    current.x =
        Math.floor(
            (COLS -
                current.matrix[0].length) / 2
        );

    current.y = 0;

    nextPiece =
        randomPiece();

    canHold = true;

    drawSidePieces();


    if (collide(current)) {

        gameOver();
    }
}


/* =========================================================
   MOVE
   ========================================================= */

function move(dx) {

    if (
        !running ||
        paused
    ) {
        return;
    }

    if (
        !collide(
            current,
            dx,
            0
        )
    ) {

        current.x += dx;

        draw();
    }
}


/* =========================================================
   SOFT DROP
   ========================================================= */

function softDrop() {

    if (
        !running ||
        paused
    ) {
        return;
    }


    if (
        !collide(
            current,
            0,
            1
        )
    ) {

        current.y++;

        score += 1;

    } else {

        lockPiece();
    }

    updateUI();

    draw();
}


/* =========================================================
   HARD DROP
   ========================================================= */

function hardDrop() {

    if (
        !running ||
        paused
    ) {
        return;
    }

    let distance = 0;


    while (
        !collide(
            current,
            0,
            1
        )
    ) {

        current.y++;

        distance++;
    }


    score +=
        distance * 2;

    lockPiece();

    updateUI();

    draw();
}


/* =========================================================
   LOCK PIECE
   ========================================================= */

function lockPiece() {

    merge();

    clearLines();

    spawnNext();
}


/* =========================================================
   ROTATION
   ========================================================= */

function rotateMatrix(matrix) {

    return matrix[0].map(
        (_, index) =>
            matrix
                .map(row => row[index])
                .reverse()
    );
}


function rotate() {

    if (
        !running ||
        paused
    ) {
        return;
    }

    const rotated =
        rotateMatrix(
            current.matrix
        );

    const oldX =
        current.x;

    current.matrix =
        rotated;


    if (collide(current)) {

        current.x++;

        if (collide(current)) {

            current.x =
                oldX - 1;

            if (collide(current)) {

                current.x =
                    oldX;

                current.matrix =
                    rotateMatrix(
                        rotateMatrix(
                            rotateMatrix(
                                rotated
                            )
                        )
                    );
            }
        }
    }

    draw();
}


/* =========================================================
   HOLD
   ========================================================= */

function hold() {

    if (
        !running ||
        paused ||
        !canHold
    ) {
        return;
    }


    if (!holdPiece) {

        holdPiece =
            current;

        current =
            nextPiece;

        nextPiece =
            randomPiece();

    } else {

        const temp =
            holdPiece;

        holdPiece =
            current;

        current =
            temp;
    }


    current.x =
        Math.floor(
            (COLS -
                current.matrix[0].length) / 2
        );

    current.y = 0;

    canHold = false;

    drawSidePieces();

    draw();
}


/* =========================================================
   GHOST PIECE
   ========================================================= */

function getGhostY() {

    let distance = 0;

    while (
        !collide(
            current,
            0,
            distance + 1
        )
    ) {

        distance++;
    }

    return current.y + distance;
}


/* =========================================================
   RESIZE
   ========================================================= */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    draw();
}


/* =========================================================
   DRAW BLOCK
   ========================================================= */

function drawBlock(
    context,
    x,
    y,
    size,
    value,
    alpha = 1
) {

    const color =
        COLORS[value];

    context.save();

    context.globalAlpha =
        alpha;


    const px =
        x + 2;

    const py =
        y + 2;

    const s =
        size - 4;


    /* Shadow */

    context.fillStyle =
        "rgba(0,0,0,.45)";

    context.fillRect(
        px + 3,
        py + 5,
        s,
        s
    );


    /* Main */

    context.fillStyle =
        color;

    context.fillRect(
        px,
        py,
        s,
        s
    );


    /* Gradient */

    const gradient =
        context.createLinearGradient(
            px,
            py,
            px,
            py + s
        );

    gradient.addColorStop(
        0,
        "rgba(255,255,255,.55)"
    );

    gradient.addColorStop(
        .15,
        "rgba(255,255,255,.12)"
    );

    gradient.addColorStop(
        .55,
        "rgba(0,0,0,.05)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,.38)"
    );


    context.fillStyle =
        gradient;

    context.fillRect(
        px,
        py,
        s,
        s
    );


    /* Border */

    context.strokeStyle =
        "rgba(255,255,255,.28)";

    context.lineWidth = 1;

    context.strokeRect(
        px + .5,
        py + .5,
        s - 1,
        s - 1
    );


    context.restore();
}


/* =========================================================
   DRAW GAME
   ========================================================= */

function draw() {

    if (!board)
        return;


    const rect =
        canvas.getBoundingClientRect();

    const width =
        rect.width;

    const height =
        rect.height;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const cellW =
        width / COLS;

    const cellH =
        height / ROWS;


    /* Background */

    ctx.fillStyle =
        "#080b11";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* Grid */

    ctx.strokeStyle =
        "rgba(255,255,255,.035)";

    ctx.lineWidth = 1;


    for (
        let x = 0;
        x <= COLS;
        x++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x * cellW,
            0
        );

        ctx.lineTo(
            x * cellW,
            height
        );

        ctx.stroke();
    }


    for (
        let y = 0;
        y <= ROWS;
        y++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y * cellH
        );

        ctx.lineTo(
            width,
            y * cellH
        );

        ctx.stroke();
    }


    /* Existing blocks */

    for (
        let y = 0;
        y < ROWS;
        y++
    ) {

        for (
            let x = 0;
            x < COLS;
            x++
        ) {

            if (board[y][x]) {

                drawBlock(
                    ctx,
                    x * cellW,
                    y * cellH,
                    Math.min(
                        cellW,
                        cellH
                    ),
                    board[y][x]
                );
            }
        }
    }


    if (!current)
        return;


    /* Ghost */

    const ghostY =
        getGhostY();


    for (
        let y = 0;
        y < current.matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < current.matrix[y].length;
            x++
        ) {

            if (
                current.matrix[y][x]
            ) {

                drawBlock(
                    ctx,
                    (current.x + x) *
                        cellW,

                    (ghostY + y) *
                        cellH,

                    Math.min(
                        cellW,
                        cellH
                    ),

                    current.matrix[y][x],

                    .16
                );
            }
        }
    }


    /* Current piece */

    for (
        let y = 0;
        y < current.matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < current.matrix[y].length;
            x++
        ) {

            if (
                current.matrix[y][x]
            ) {

                drawBlock(
                    ctx,
                    (current.x + x) *
                        cellW,

                    (current.y + y) *
                        cellH,

                    Math.min(
                        cellW,
                        cellH
                    ),

                    current.matrix[y][x]
                );
            }
        }
    }
}


/* =========================================================
   MINI PIECES
   ========================================================= */

function drawMini(
    context,
    canvasElement,
    piece
) {

    const rect =
        canvasElement.getBoundingClientRect();

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvasElement.width =
        rect.width * dpr;

    canvasElement.height =
        rect.height * dpr;


    context.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    context.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );


    if (!piece)
        return;


    const matrix =
        piece.matrix;


    const size =
        Math.min(
            rect.width / 5,
            rect.height / 4
        );


    const totalW =
        matrix[0].length * size;

    const totalH =
        matrix.length * size;


    const startX =
        (rect.width - totalW) / 2;

    const startY =
        (rect.height - totalH) / 2;


    for (
        let y = 0;
        y < matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < matrix[y].length;
            x++
        ) {

            if (
                matrix[y][x]
            ) {

                drawBlock(
                    context,

                    startX +
                        x * size,

                    startY +
                        y * size,

                    size,

                    matrix[y][x]
                );
            }
        }
    }
}


/* =========================================================
   DRAW NEXT + HOLD
   ========================================================= */

function drawSidePieces() {

    drawMini(
        nextCtx,
        nextCanvas,
        nextPiece
    );

    drawMini(
        holdCtx,
        holdCanvas,
        holdPiece
    );
}


/* =========================================================
   UI
   ========================================================= */

function updateUI() {

    scoreEl.textContent =
        score.toLocaleString();

    levelEl.textContent =
        level;

    linesEl.textContent =
        lines;
}


/* =========================================================
   OVERLAY HELPERS
   ========================================================= */

function hideAllOverlayButtons() {

    playBtn.classList.add(
        "hidden-btn"
    );

    resumeBtn.classList.add(
        "hidden-btn"
    );

    restartBtn.classList.add(
        "hidden-btn"
    );

    exitBtn.classList.add(
        "hidden-btn"
    );
}


function showOverlay() {

    overlay.classList.remove(
        "hidden"
    );
}


function hideOverlay() {

    overlay.classList.add(
        "hidden"
    );
}


/* =========================================================
   MAIN MENU
   ========================================================= */

function showMainMenu() {

    running = false;

    paused = false;

    cancelGameLoop();


    overlayTitle.textContent =
        "VOIDBLOCK";

    overlayText.textContent =
        "READY?";


    hideAllOverlayButtons();


    playBtn.classList.remove(
        "hidden-btn"
    );


    showOverlay();

    draw();
}


/* =========================================================
   PAUSE MENU
   ========================================================= */

function showPauseMenu() {

    overlayTitle.textContent =
        "PAUSED";

    overlayText.textContent =
        "GAME PAUSED";


    hideAllOverlayButtons();


    resumeBtn.classList.remove(
        "hidden-btn"
    );

    restartBtn.classList.remove(
        "hidden-btn"
    );

    exitBtn.classList.remove(
        "hidden-btn"
    );


    showOverlay();
}


/* =========================================================
   GAME OVER MENU
   ========================================================= */

function showGameOverMenu() {

    overlayTitle.textContent =
        "GAME OVER";

    overlayText.textContent =
        `SCORE ${score.toLocaleString()}`;


    hideAllOverlayButtons();


    restartBtn.classList.remove(
        "hidden-btn"
    );

    exitBtn.classList.remove(
        "hidden-btn"
    );


    showOverlay();
}


/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver() {

    running = false;

    paused = false;

    cancelGameLoop();

    showGameOverMenu();
}


/* =========================================================
   START GAME
   ========================================================= */

function startGame() {

    cancelGameLoop();

    resetGame();

    running = true;

    paused = false;

    hideOverlay();

    lastTime =
        performance.now();

    dropTimer = 0;

    startGameLoop();
}


/* =========================================================
   RESTART GAME
   ========================================================= */

function restartGame() {

    cancelGameLoop();

    resetGame();

    running = true;

    paused = false;

    hideOverlay();

    lastTime =
        performance.now();

    dropTimer = 0;

    startGameLoop();
}


/* =========================================================
   PAUSE
   ========================================================= */

function pauseGame() {

    if (
        !running ||
        paused
    ) {
        return;
    }


    paused = true;

    cancelGameLoop();

    showPauseMenu();
}


/* =========================================================
   RESUME
   ========================================================= */

function resumeGame() {

    if (
        !running ||
        !paused
    ) {
        return;
    }


    paused = false;

    hideOverlay();

    lastTime =
        performance.now();

    dropTimer = 0;

    startGameLoop();
}


/* =========================================================
   TOGGLE PAUSE
   ========================================================= */

function togglePause() {

    if (!running)
        return;


    if (paused) {

        resumeGame();

    } else {

        pauseGame();
    }
}


/* =========================================================
   EXIT GAME
   ========================================================= */

function exitGame() {

    cancelGameLoop();

    running = false;

    paused = false;

    /*
       Completely clear the current
       in-memory game state.
    */

    board =
        createBoard();

    current = null;

    nextPiece = null;

    holdPiece = null;

    canHold = true;

    score = 0;

    level = 1;

    lines = 0;

    dropTimer = 0;

    updateUI();

    drawSidePieces();

    showMainMenu();

    draw();
}


/* =========================================================
   GAME LOOP CONTROL
   ========================================================= */

function cancelGameLoop() {

    if (
        animationFrameId !== null
    ) {

        cancelAnimationFrame(
            animationFrameId
        );

        animationFrameId = null;
    }
}


function startGameLoop() {

    cancelGameLoop();

    animationFrameId =
        requestAnimationFrame(
            loop
        );
}


/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(time) {

    animationFrameId = null;


    if (
        !running ||
        paused
    ) {
        return;
    }


    const delta =
        time - lastTime;

    lastTime =
        time;


    dropTimer += delta;


    const speed =
        Math.max(
            80,
            800 -
            (level - 1) * 65
        );


    if (
        dropTimer >= speed
    ) {

        dropTimer = 0;


        if (
            !collide(
                current,
                0,
                1
            )
        ) {

            current.y++;

        } else {

            lockPiece();
        }
    }


    draw();


    if (
        running &&
        !paused
    ) {

        animationFrameId =
            requestAnimationFrame(
                loop
            );
    }
}


/* =========================================================
   BUTTONS
   ========================================================= */


/* PLAY */

playBtn.addEventListener(
    "click",
    startGame
);


/* RESUME */

resumeBtn.addEventListener(
    "click",
    resumeGame
);


/* RESTART */

restartBtn.addEventListener(
    "click",
    restartGame
);


/* EXIT FROM OVERLAY */

exitBtn.addEventListener(
    "click",
    exitGame
);


/* PAUSE */

pauseBtn.addEventListener(
    "click",
    pauseGame
);


/* DIRECT EXIT */

gameExitBtn.addEventListener(
    "click",
    exitGame
);


/* MOVE LEFT */

document
    .getElementById("leftBtn")
    .addEventListener(
        "click",
        () => move(-1)
    );


/* MOVE RIGHT */

document
    .getElementById("rightBtn")
    .addEventListener(
        "click",
        () => move(1)
    );


/* ROTATE */

document
    .getElementById("rotateBtn")
    .addEventListener(
        "click",
        rotate
    );


/* HARD DROP */

document
    .getElementById("dropBtn")
    .addEventListener(
        "click",
        hardDrop
    );


/* HOLD */

document
    .getElementById("holdBtn")
    .addEventListener(
        "click",
        hold
    );


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            [
                "ArrowLeft",
                "ArrowRight",
                "ArrowDown",
                "ArrowUp",
                " "
            ].includes(event.key)
        ) {

            event.preventDefault();
        }


        switch (event.key) {

            case "ArrowLeft":

                move(-1);

                break;


            case "ArrowRight":

                move(1);

                break;


            case "ArrowDown":

                softDrop();

                break;


            case "ArrowUp":

                rotate();

                break;


            case " ":

                hardDrop();

                break;


            case "c":
            case "C":

                hold();

                break;


            case "p":
            case "P":

                togglePause();

                break;


            case "r":
            case "R":

                if (running) {

                    restartGame();

                } else {

                    startGame();
                }

                break;


            case "Escape":

                if (running) {

                    if (paused) {

                        exitGame();

                    } else {

                        pauseGame();
                    }
                }

                break;
        }

    }
);


/* =========================================================
   TOUCH SWIPES
   ========================================================= */

let touchStartX = 0;

let touchStartY = 0;

let touchStartTime = 0;


canvas.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

        touchStartTime =
            performance.now();


        event.preventDefault();

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchend",
    event => {

        const touch =
            event.changedTouches[0];


        const dx =
            touch.clientX -
            touchStartX;

        const dy =
            touch.clientY -
            touchStartY;


        const duration =
            performance.now() -
            touchStartTime;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /* TAP = ROTATE */

        if (
            distance < 25 &&
            duration < 300
        ) {

            rotate();

            event.preventDefault();

            return;
        }


        /* HORIZONTAL SWIPE */

        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (
                Math.abs(dx) > 30
            ) {

                move(
                    dx > 0
                        ? 1
                        : -1
                );
            }

        }

        /* VERTICAL SWIPE */

        else {

            if (dy > 30) {

                softDrop();

            } else if (dy < -30) {

                hardDrop();
            }
        }


        event.preventDefault();

    },
    {
        passive: false
    }
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        resizeCanvas();

        drawSidePieces();

    }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

resetGame();

resizeCanvas();

draw();

/*
   Start at MAIN MENU.
*/

showMainMenu();

</script>

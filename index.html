<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>VOIDBLOCK — Realistic Tetris</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070b;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    overscroll-behavior: none;
}


/* =========================================================
   BUTTONS
   ========================================================= */

button {
    border: 0;
    color: white;
    background: #151a24;
    border-radius: 12px;
    cursor: pointer;
    user-select: none;

    /*
       Important for Android/iPhone/iPad/tablets.
    */
    touch-action: manipulation;

    -webkit-user-select: none;
    -webkit-touch-callout: none;

    font-weight: 700;
}

button:active {
    transform: scale(.94);
}

button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
}


/* =========================================================
   APP
   ========================================================= */

#app {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 12px;

    touch-action: none;
}


/* =========================================================
   GAME SHELL
   ========================================================= */

.game-shell {
    width: min(1100px, 100%);
    height: min(900px, 100%);

    display: grid;

    grid-template-columns:
        180px
        minmax(280px, 430px)
        180px;

    gap: 22px;

    align-items: center;
    justify-content: center;
}


/* =========================================================
   SIDE PANELS
   ========================================================= */

.side {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.logo {
    font-size: 26px;
    letter-spacing: 5px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 8px;
}

.panel {
    background:
        linear-gradient(
            145deg,
            #111722,
            #090c12
        );

    border: 1px solid #252d3a;

    border-radius: 16px;

    padding: 14px;

    box-shadow:
        inset 0 1px rgba(255,255,255,.04),
        0 10px 30px rgba(0,0,0,.3);
}

.label {
    color: #7e899b;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 6px;
}

.value {
    font-size: 25px;
    font-weight: 900;
}

#nextCanvas,
#holdCanvas {
    width: 100%;
    height: 100px;

    display: block;

    touch-action: none;
}


/* =========================================================
   BOARD
   ========================================================= */

.board-wrap {
    position: relative;

    width: 100%;

    aspect-ratio: 10 / 20;

    max-height: 82vh;

    margin: auto;

    touch-action: none;
}

#gameCanvas {
    width: 100%;
    height: 100%;

    display: block;

    background: #080b11;

    border: 2px solid #293342;

    border-radius: 14px;

    box-shadow:
        0 0 50px rgba(0,0,0,.65),
        inset 0 0 30px rgba(0,0,0,.5);

    /*
       CRITICAL FOR TOUCH CONTROLS.
    */
    touch-action: none;

    -webkit-user-select: none;
    user-select: none;
}


/* =========================================================
   OVERLAY
   ========================================================= */

.overlay {
    position: absolute;

    inset: 2px;

    border-radius: 12px;

    background: rgba(3,5,9,.86);

    backdrop-filter: blur(8px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 14px;

    text-align: center;

    z-index: 10;

    padding: 20px;

    touch-action: manipulation;
}

.overlay.hidden {
    display: none;
}

.overlay h1 {
    font-size: clamp(28px, 7vw, 52px);

    letter-spacing: 6px;
}

.overlay p {
    color: #8994a7;

    min-height: 20px;
}

.overlay-actions {
    width: min(230px, 85%);

    display: flex;

    flex-direction: column;

    gap: 10px;
}

.overlay-btn {
    width: 100%;

    min-height: 48px;

    font-size: 14px;

    letter-spacing: 1px;
}

.primary {
    background: #fff;

    color: #05070b;
}

.secondary {
    background: #151a24;

    border: 1px solid #303a4a;
}

.danger {
    background: #35161b;

    border: 1px solid #7d3039;
}

.hidden-btn {
    display: none !important;
}


/* =========================================================
   CONTROLS
   ========================================================= */

.controls {
    /* Hidden by default on mouse/keyboard-only devices.
       JavaScript adds .touch-device when a touchscreen is detected. */
    display: none;

    flex-direction: column;

    gap: 9px;
}

/* Show on-screen controls only when a touchscreen is available. */
.touch-device .controls {
    display: flex;
}

/* Keep the desktop layout clean when no touchscreen exists. */
.non-touch .controls {
    display: none !important;
}

.control-row {
    display: flex;

    gap: 9px;
}

.control {
    flex: 1;

    min-height: 54px;

    font-size: 19px;

    border: 1px solid #293342;
}

.rotate {
    background: #222b3a;

    font-size: 24px;
}

.drop {
    width: 100%;

    min-height: 58px;

    background: #f0f2f5;

    color: #05070b;

    font-size: 13px;
}

.action {
    width: 100%;

    min-height: 44px;
}

.exit-action {
    background: #35161b;

    border: 1px solid #6b2a32;
}


/* =========================================================
   RESPONSIVE LAYOUT
   ========================================================= */

/* Desktop / large tablets */
@media (min-width: 801px) {
    #app {
        padding:
            max(12px, env(safe-area-inset-top))
            max(12px, env(safe-area-inset-right))
            max(12px, env(safe-area-inset-bottom))
            max(12px, env(safe-area-inset-left));
    }

    .game-shell {
        width: min(1100px, 100%);
        height: min(900px, 100%);
        grid-template-columns:
            clamp(150px, 17vw, 180px)
            minmax(280px, 430px)
            clamp(150px, 17vw, 180px);
        gap: clamp(10px, 2vw, 22px);
    }

    .board-wrap {
        width: min(100%, 430px);
        height: min(82vh, 860px);
        aspect-ratio: 10 / 20;
    }
}

/* Tablets and phones in portrait */
@media (max-width: 800px) {
    html,
    body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
    }

    #app {
        width: 100%;
        height: 100dvh;
        min-height: 100svh;
        padding:
            max(4px, env(safe-area-inset-top))
            max(4px, env(safe-area-inset-right))
            max(4px, env(safe-area-inset-bottom))
            max(4px, env(safe-area-inset-left));
        overflow: hidden;
    }

    .game-shell {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 0;
        overflow: hidden;
    }

    .side {
        display: contents;
    }

    .logo {
        position: absolute;
        top: max(6px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        font-size: clamp(15px, 4.5vw, 21px);
        line-height: 1;
        letter-spacing: clamp(2px, 1vw, 4px);
        white-space: nowrap;
        pointer-events: none;
    }

    .left-panel,
    .right-panel {
        position: static;
    }

    .left-panel > .panel:nth-child(2),
    .right-panel > .panel:nth-child(1) {
        display: block;
    }

    /* Compact score / level / lines HUD */
    .left-panel > .panel:nth-child(2) {
        position: absolute;
        top: max(34px, calc(env(safe-area-inset-top) + 28px));
        left: max(6px, env(safe-area-inset-left));
        z-index: 5;
        padding: 5px 8px;
    }

    .left-panel > .panel:nth-child(3) {
        position: absolute;
        top: max(34px, calc(env(safe-area-inset-top) + 28px));
        left: max(6px, env(safe-area-inset-left));
        z-index: 5;
        padding: 5px 8px;
        transform: translateY(34px);
    }

    .left-panel > .panel:nth-child(4) {
        position: absolute;
        top: max(34px, calc(env(safe-area-inset-top) + 28px));
        left: max(6px, env(safe-area-inset-left));
        z-index: 5;
        padding: 5px 8px;
        transform: translateY(68px);
    }

    .right-panel .panel {
        position: absolute;
        top: max(34px, calc(env(safe-area-inset-top) + 28px));
        right: max(6px, env(safe-area-inset-right));
        z-index: 5;
        padding: 5px 8px;
    }

    .right-panel .panel .label {
        margin-bottom: 0;
    }

    .right-panel .controls {
        position: absolute;
        z-index: 6;
        left: 50%;
        bottom: max(5px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: min(96vw, 430px);
        padding: 0;
    }

    .panel {
        background: rgba(8, 11, 17, .82);
        border-radius: 9px;
        backdrop-filter: blur(5px);
    }

    .label {
        font-size: 7px;
        letter-spacing: 1px;
        margin-bottom: 1px;
    }

    .value {
        font-size: clamp(13px, 4vw, 17px);
        line-height: 1;
    }

    #nextCanvas,
    #holdCanvas {
        display: none;
    }

    /* The board gets ALL remaining vertical space.
       Its 10:20 ratio is preserved, so it never stretches. */
    .board-wrap {
        flex: 1 1 auto;
        width: min(
            94vw,
            calc((100dvh - 148px) / 2),
            430px
        );
        height: auto;
        max-width: 430px;
        max-height: calc(100dvh - 148px);
        aspect-ratio: 10 / 20;
        align-self: center;
        justify-self: center;
        margin: 0 auto;
        min-height: 240px;
    }

    #gameCanvas {
        width: 100%;
        height: 100%;
    }

    .controls {
        gap: 7px;
    }

    .control-row {
        gap: 7px;
    }

    .control {
        min-height: clamp(48px, 8dvh, 58px);
        font-size: clamp(17px, 5vw, 22px);
    }

    .rotate {
        font-size: clamp(22px, 6vw, 28px);
    }

    .drop,
    .action {
        min-height: clamp(38px, 6dvh, 48px);
    }

    .drop {
        font-size: 12px;
    }

    button {
        -webkit-tap-highlight-color: transparent;
    }
}

/* Very small portrait phones */
@media (max-width: 390px) and (orientation: portrait) {
    .board-wrap {
        width: min(
            92vw,
            calc((100dvh - 136px) / 2)
        );
        max-height: calc(100dvh - 136px);
        min-height: 220px;
    }

    .left-panel > .panel:nth-child(2),
    .left-panel > .panel:nth-child(3),
    .left-panel > .panel:nth-child(4),
    .right-panel .panel {
        padding: 4px 6px;
    }

    .label {
        font-size: 6px;
    }

    .value {
        font-size: 12px;
    }

    .controls {
        gap: 5px;
    }

    .control-row {
        gap: 5px;
    }

    .control {
        min-height: 45px;
    }

    .drop,
    .action {
        min-height: 36px;
    }
}

/* Landscape phones / short screens */
@media (max-height: 600px) and (orientation: landscape) {
    #app {
        padding: 3px;
    }

    .game-shell {
        display: grid;
        grid-template-columns:
            minmax(80px, 130px)
            minmax(180px, 42vh)
            minmax(80px, 130px);
        grid-template-rows: 1fr;
        align-items: center;
        justify-content: center;
        gap: clamp(5px, 1.5vw, 12px);
    }

    .logo {
        display: block;
        top: 5px;
        font-size: clamp(13px, 3vw, 18px);
    }

    .left-panel,
    .right-panel {
        display: flex;
        position: static;
        width: 100%;
        height: 100%;
        gap: 5px;
    }

    .left-panel {
        align-items: center;
    }

    .right-panel {
        align-items: center;
    }

    .left-panel .panel,
    .right-panel .panel {
        position: static;
        transform: none;
        width: 100%;
        padding: 6px;
    }

    .left-panel > .panel:nth-child(2),
    .left-panel > .panel:nth-child(3),
    .left-panel > .panel:nth-child(4),
    .right-panel .panel {
        position: static;
        transform: none;
    }

    .left-panel > .panel:nth-child(2) {
        display: block;
    }

    .left-panel > .panel:nth-child(2) {
        /* HOLD remains hidden on short landscape screens */
        display: none;
    }

    .left-panel > .panel:nth-child(3),
    .left-panel > .panel:nth-child(4) {
        display: block;
    }

    .right-panel .panel {
        display: block;
    }

    .right-panel .controls {
        position: static;
        width: 100%;
        transform: none;
        margin-top: auto;
        margin-bottom: 2px;
    }

    .board-wrap {
        grid-column: 2;
        grid-row: 1;
        width: min(42vh, 300px);
        height: min(84vh, 600px);
        max-height: calc(100dvh - 10px);
        min-height: 0;
        aspect-ratio: 10 / 20;
        margin: 0;
    }

    .control {
        min-height: clamp(34px, 10vh, 48px);
        font-size: clamp(14px, 3vw, 19px);
    }

    .rotate {
        font-size: clamp(18px, 4vw, 24px);
    }

    .drop,
    .action {
        min-height: clamp(30px, 8vh, 40px);
    }

    .label {
        font-size: 7px;
    }

    .value {
        font-size: 15px;
    }
}

/* Landscape tablets / short desktop windows */
@media (min-width: 801px) and (max-height: 650px) {
    .game-shell {
        grid-template-columns:
            140px
            minmax(220px, 330px)
            140px;
        gap: 10px;
    }

    .board-wrap {
        width: min(330px, 44vh);
        height: min(660px, 88vh);
    }

    .panel {
        padding: 9px;
    }

    .controls {
        gap: 6px;
    }

    .control {
        min-height: 46px;
    }
}

/* Prevent accidental text selection / browser gesture handling
   on touch controls. */
@media (pointer: coarse) {
    button,
    .board-wrap,
    #gameCanvas {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
    }
}
</style>
</head>

<div id="app">

<script>

"use strict";

/* =========================================================
   TOUCHSCREEN DETECTION
   =========================================================

   Show the on-screen game controls only when the current
   device actually has touch capability. This supports:
   - Android / iPhone / iPad
   - Touch tablets
   - Windows touchscreen laptops
   - Hybrid 2-in-1 devices

   Normal mouse + keyboard desktops keep the touch controls
   hidden and use the keyboard controls instead.
   ========================================================= */

(function detectTouchscreen() {

    const hasTouchPoints =
        (navigator.maxTouchPoints || 0) > 0 ||
        (navigator.msMaxTouchPoints || 0) > 0;

    const hasTouchMedia =
        window.matchMedia &&
        (window.matchMedia("(pointer: coarse)").matches ||
         window.matchMedia("(any-pointer: coarse)").matches);

    const touchAvailable =
        hasTouchPoints || hasTouchMedia ||
        ("ontouchstart" in window);

    document.documentElement.classList.toggle(
        "touch-device",
        touchAvailable
    );

    document.documentElement.classList.toggle(
        "non-touch",
        !touchAvailable
    );

})();


/* =========================================================
   VOIDBLOCK
   =========================================================

   CONTROLS

   KEYBOARD:

   LEFT ARROW  = MOVE LEFT
   RIGHT ARROW = MOVE RIGHT
   DOWN ARROW  = SOFT DROP

   X = ROTATE CLOCKWISE
   Z = ROTATE COUNTER-CLOCKWISE

   SPACE = HARD DROP
   C = HOLD
   P = PAUSE
   R = RESTART
   ESC = PAUSE / EXIT

   IMPORTANT:

   ARROW UP IS NOT USED FOR ROTATION.


   TOUCH:

   TAP BOARD = ROTATE CLOCKWISE

   SWIPE LEFT  = MOVE LEFT
   SWIPE RIGHT = MOVE RIGHT
   SWIPE DOWN  = SOFT DROP
   SWIPE UP    = HARD DROP

   ON-SCREEN ↻ BUTTON = ROTATE


   NO DATABASE
   NO LOCALSTORAGE
   NO BACKEND
   NO LOGIN

   ========================================================= */


/* =========================================================
   CONSTANTS
   ========================================================= */

const COLS = 10;

const ROWS = 20;


/* =========================================================
   CANVAS
   ========================================================= */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


const nextCanvas =
    document.getElementById(
        "nextCanvas"
    );

const nextCtx =
    nextCanvas.getContext("2d");


const holdCanvas =
    document.getElementById(
        "holdCanvas"
    );

const holdCtx =
    holdCanvas.getContext("2d");


/* =========================================================
   UI
   ========================================================= */

const scoreEl =
    document.getElementById(
        "score"
    );

const levelEl =
    document.getElementById(
        "level"
    );

const linesEl =
    document.getElementById(
        "lines"
    );


/* =========================================================
   OVERLAY
   ========================================================= */

const overlay =
    document.getElementById(
        "overlay"
    );

const overlayTitle =
    document.getElementById(
        "overlayTitle"
    );

const overlayText =
    document.getElementById(
        "overlayText"
    );

const playBtn =
    document.getElementById(
        "playBtn"
    );

const resumeBtn =
    document.getElementById(
        "resumeBtn"
    );

const restartBtn =
    document.getElementById(
        "restartBtn"
    );

const exitBtn =
    document.getElementById(
        "exitBtn"
    );


/* =========================================================
   GAME CONTROLS
   ========================================================= */

const leftBtn =
    document.getElementById(
        "leftBtn"
    );

const rotateBtn =
    document.getElementById(
        "rotateBtn"
    );

const rightBtn =
    document.getElementById(
        "rightBtn"
    );

const dropBtn =
    document.getElementById(
        "dropBtn"
    );

const holdBtn =
    document.getElementById(
        "holdBtn"
    );

const pauseBtn =
    document.getElementById(
        "pauseBtn"
    );

const gameExitBtn =
    document.getElementById(
        "gameExitBtn"
    );


/* =========================================================
   GAME STATE
   ========================================================= */

let board;

let current;

let nextPiece;

let holdPiece = null;

let canHold = true;

let score = 0;

let level = 1;

let lines = 0;

let running = false;

let paused = false;

let dropTimer = 0;

let lastTime = 0;

let animationFrameId = null;


/* =========================================================
   COLORS
   ========================================================= */

const COLORS = [

    null,

    "#00e5ff",

    "#ffe600",

    "#b45cff",

    "#4cff6a",

    "#ff4757",

    "#4d7cff",

    "#ff9f43"

];


/* =========================================================
   TETROMINOES
   ========================================================= */

const PIECES = [


    /* I */

    [
        [1,1,1,1]
    ],


    /* O */

    [
        [2,2],
        [2,2]
    ],


    /* T */

    [
        [0,3,0],
        [3,3,3]
    ],


    /* S */

    [
        [0,4,4],
        [4,4,0]
    ],


    /* Z */

    [
        [5,5,0],
        [0,5,5]
    ],


    /* J */

    [
        [6,0,0],
        [6,6,6]
    ],


    /* L */

    [
        [0,0,7],
        [7,7,7]
    ]

];


/* =========================================================
   BOARD
   ========================================================= */

function createBoard() {

    return Array.from(
        {
            length: ROWS
        },

        () =>
            Array(
                COLS
            ).fill(0)
    );
}


/* =========================================================
   CLONE MATRIX
   ========================================================= */

function cloneMatrix(matrix) {

    return matrix.map(
        row => [...row]
    );
}


/* =========================================================
   RANDOM PIECE
   ========================================================= */

function randomPiece() {

    const matrix =
        cloneMatrix(
            PIECES[
                Math.floor(
                    Math.random() *
                    PIECES.length
                )
            ]
        );


    return {

        matrix,

        x:
            Math.floor(
                (
                    COLS -
                    matrix[0].length
                ) / 2
            ),

        y: 0

    };
}


/* =========================================================
   RESET GAME
   ========================================================= */

function resetGame() {

    board =
        createBoard();


    score = 0;

    level = 1;

    lines = 0;


    holdPiece = null;

    canHold = true;


    current =
        randomPiece();


    nextPiece =
        randomPiece();


    dropTimer = 0;


    updateUI();

    drawSidePieces();

    draw();
}


/* =========================================================
   COLLISION
   ========================================================= */

function collide(
    piece,
    offsetX = 0,
    offsetY = 0,
    matrix = piece.matrix
) {

    for (
        let y = 0;
        y < matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < matrix[y].length;
            x++
        ) {

            if (
                !matrix[y][x]
            ) {
                continue;
            }


            const bx =
                piece.x +
                x +
                offsetX;


            const by =
                piece.y +
                y +
                offsetY;


            if (
                bx < 0 ||
                bx >= COLS ||
                by >= ROWS
            ) {

                return true;
            }


            if (
                by >= 0 &&
                board[by][bx]
            ) {

                return true;
            }

        }
    }


    return false;
}


/* =========================================================
   MERGE
   ========================================================= */

function merge() {

    for (
        let y = 0;
        y < current.matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < current.matrix[y].length;
            x++
        ) {

            if (
                !current.matrix[y][x]
            ) {
                continue;
            }


            const by =
                current.y + y;


            const bx =
                current.x + x;


            if (
                by >= 0 &&
                by < ROWS &&
                bx >= 0 &&
                bx < COLS
            ) {

                board[by][bx] =
                    current.matrix[y][x];
            }

        }
    }
}


/* =========================================================
   CLEAR LINES
   ========================================================= */

function clearLines() {

    let cleared = 0;


    for (
        let y = ROWS - 1;
        y >= 0;
        y--
    ) {

        if (
            board[y].every(Boolean)
        ) {

            board.splice(
                y,
                1
            );


            board.unshift(
                Array(COLS).fill(0)
            );


            cleared++;

            y++;
        }
    }


    if (
        cleared > 0
    ) {

        const points = [
            0,
            100,
            300,
            500,
            800
        ];


        score +=
            points[cleared] *
            level;


        lines += cleared;


        level =
            Math.floor(
                lines / 10
            ) + 1;


        updateUI();
    }
}


/* =========================================================
   SPAWN NEXT
   ========================================================= */

function spawnNext() {

    current =
        nextPiece;


    current.x =
        Math.floor(
            (
                COLS -
                current.matrix[0].length
            ) / 2
        );


    current.y = 0;


    nextPiece =
        randomPiece();


    canHold = true;


    drawSidePieces();


    if (
        collide(current)
    ) {

        gameOver();
    }
}


/* =========================================================
   MOVE
   ========================================================= */

function move(dx) {

    if (
        !running ||
        paused
    ) {
        return;
    }


    if (
        !collide(
            current,
            dx,
            0
        )
    ) {

        current.x += dx;

        draw();
    }
}


/* =========================================================
   SOFT DROP
   ========================================================= */

function softDrop() {

    if (
        !running ||
        paused
    ) {
        return;
    }


    if (
        !collide(
            current,
            0,
            1
        )
    ) {

        current.y++;

        score += 1;

    } else {

        lockPiece();
    }


    updateUI();

    draw();
}


/* =========================================================
   HARD DROP
   ========================================================= */

function hardDrop() {

    if (
        !running ||
        paused
    ) {
        return;
    }


    let distance = 0;


    while (
        !collide(
            current,
            0,
            1
        )
    ) {

        current.y++;

        distance++;
    }


    score +=
        distance * 2;


    lockPiece();


    updateUI();

    draw();
}


/* =========================================================
   LOCK
   ========================================================= */

function lockPiece() {

    merge();

    clearLines();

    spawnNext();
}


/* =========================================================
   ROTATE CLOCKWISE
   ========================================================= */

function rotateMatrix(matrix) {

    return matrix[0].map(
        (_, index) =>
            matrix
                .map(
                    row =>
                        row[index]
                )
                .reverse()
    );
}


function rotate() {

    if (
        !running ||
        paused
    ) {
        return;
    }


    const oldMatrix =
        cloneMatrix(
            current.matrix
        );


    const oldX =
        current.x;


    const rotated =
        rotateMatrix(
            current.matrix
        );


    current.matrix =
        rotated;


    /*
       Normal position.
    */

    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Wall kick right.
    */

    current.x =
        oldX + 1;


    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Wall kick left.
    */

    current.x =
        oldX - 1;


    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Larger wall kick.
    */

    current.x =
        oldX - 2;


    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Restore.
    */

    current.x =
        oldX;


    current.matrix =
        oldMatrix;


    draw();
}


/* =========================================================
   ROTATE COUNTER-CLOCKWISE
   ========================================================= */

function rotateCounterClockwise() {

    if (
        !running ||
        paused
    ) {
        return;
    }


    const oldMatrix =
        cloneMatrix(
            current.matrix
        );


    const oldX =
        current.x;


    /*
       Three clockwise rotations
       produce one counter-clockwise
       rotation.
    */

    let rotated =
        rotateMatrix(
            current.matrix
        );


    rotated =
        rotateMatrix(
            rotated
        );


    rotated =
        rotateMatrix(
            rotated
        );


    current.matrix =
        rotated;


    /*
       Normal position.
    */

    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Wall kick right.
    */

    current.x =
        oldX + 1;


    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Wall kick left.
    */

    current.x =
        oldX - 1;


    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Larger wall kick.
    */

    current.x =
        oldX - 2;


    if (
        !collide(current)
    ) {

        draw();

        return;
    }


    /*
       Restore.
    */

    current.x =
        oldX;


    current.matrix =
        oldMatrix;


    draw();
}


/* =========================================================
   HOLD
   ========================================================= */

function hold() {

    if (
        !running ||
        paused ||
        !canHold
    ) {
        return;
    }


    if (
        !holdPiece
    ) {

        holdPiece =
            current;


        current =
            nextPiece;


        nextPiece =
            randomPiece();

    } else {

        const temp =
            holdPiece;


        holdPiece =
            current;


        current =
            temp;
    }


    current.x =
        Math.floor(
            (
                COLS -
                current.matrix[0].length
            ) / 2
        );


    current.y = 0;


    canHold = false;


    drawSidePieces();

    draw();
}


/* =========================================================
   GHOST
   ========================================================= */

function getGhostY() {

    let distance = 0;


    while (
        !collide(
            current,
            0,
            distance + 1
        )
    ) {

        distance++;
    }


    return current.y + distance;
}


/* =========================================================
   RESIZE
   ========================================================= */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        Math.max(
            1,
            Math.floor(
                rect.width * dpr
            )
        );


    canvas.height =
        Math.max(
            1,
            Math.floor(
                rect.height * dpr
            )
        );


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    draw();
}


/* =========================================================
   DRAW BLOCK
   ========================================================= */

function drawBlock(
    context,
    x,
    y,
    size,
    value,
    alpha = 1
) {

    const color =
        COLORS[value];


    context.save();


    context.globalAlpha =
        alpha;


    const px =
        x + 2;


    const py =
        y + 2;


    const s =
        size - 4;


    /*
       Shadow.
    */

    context.fillStyle =
        "rgba(0,0,0,.45)";


    context.fillRect(
        px + 3,
        py + 5,
        s,
        s
    );


    /*
       Main block.
    */

    context.fillStyle =
        color;


    context.fillRect(
        px,
        py,
        s,
        s
    );


    /*
       Gradient.
    */

    const gradient =
        context.createLinearGradient(
            px,
            py,
            px,
            py + s
        );


    gradient.addColorStop(
        0,
        "rgba(255,255,255,.55)"
    );


    gradient.addColorStop(
        .15,
        "rgba(255,255,255,.12)"
    );


    gradient.addColorStop(
        .55,
        "rgba(0,0,0,.05)"
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,.38)"
    );


    context.fillStyle =
        gradient;


    context.fillRect(
        px,
        py,
        s,
        s
    );


    /*
       Border.
    */

    context.strokeStyle =
        "rgba(255,255,255,.28)";


    context.lineWidth = 1;


    context.strokeRect(
        px + .5,
        py + .5,
        s - 1,
        s - 1
    );


    context.restore();
}


/* =========================================================
   DRAW
   ========================================================= */

function draw() {

    if (
        !board
    ) {
        return;
    }


    const rect =
        canvas.getBoundingClientRect();


    const width =
        rect.width;


    const height =
        rect.height;


    if (
        width <= 0 ||
        height <= 0
    ) {
        return;
    }


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    const cellW =
        width / COLS;


    const cellH =
        height / ROWS;


    /*
       Background.
    */

    ctx.fillStyle =
        "#080b11";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
       Grid.
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.035)";


    ctx.lineWidth = 1;


    for (
        let x = 0;
        x <= COLS;
        x++
    ) {

        ctx.beginPath();


        ctx.moveTo(
            x * cellW,
            0
        );


        ctx.lineTo(
            x * cellW,
            height
        );


        ctx.stroke();
    }


    for (
        let y = 0;
        y <= ROWS;
        y++
    ) {

        ctx.beginPath();


        ctx.moveTo(
            0,
            y * cellH
        );


        ctx.lineTo(
            width,
            y * cellH
        );


        ctx.stroke();
    }


    /*
       Existing blocks.
    */

    for (
        let y = 0;
        y < ROWS;
        y++
    ) {

        for (
            let x = 0;
            x < COLS;
            x++
        ) {

            if (
                board[y][x]
            ) {

                drawBlock(
                    ctx,

                    x * cellW,

                    y * cellH,

                    Math.min(
                        cellW,
                        cellH
                    ),

                    board[y][x]
                );
            }
        }
    }


    if (
        !current
    ) {
        return;
    }


    /*
       Ghost piece.
    */

    const ghostY =
        getGhostY();


    for (
        let y = 0;
        y < current.matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < current.matrix[y].length;
            x++
        ) {

            if (
                current.matrix[y][x]
            ) {

                drawBlock(
                    ctx,

                    (
                        current.x +
                        x
                    ) * cellW,

                    (
                        ghostY +
                        y
                    ) * cellH,

                    Math.min(
                        cellW,
                        cellH
                    ),

                    current.matrix[y][x],

                    .16
                );
            }
        }
    }


    /*
       Current piece.
    */

    for (
        let y = 0;
        y < current.matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < current.matrix[y].length;
            x++
        ) {

            if (
                current.matrix[y][x]
            ) {

                drawBlock(
                    ctx,

                    (
                        current.x +
                        x
                    ) * cellW,

                    (
                        current.y +
                        y
                    ) * cellH,

                    Math.min(
                        cellW,
                        cellH
                    ),

                    current.matrix[y][x]
                );
            }
        }
    }
}


/* =========================================================
   MINI PIECES
   ========================================================= */

function drawMini(
    context,
    canvasElement,
    piece
) {

    const rect =
        canvasElement.getBoundingClientRect();


    if (
        rect.width <= 0 ||
        rect.height <= 0
    ) {
        return;
    }


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvasElement.width =
        Math.max(
            1,
            Math.floor(
                rect.width * dpr
            )
        );


    canvasElement.height =
        Math.max(
            1,
            Math.floor(
                rect.height * dpr
            )
        );


    context.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    context.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );


    if (
        !piece
    ) {
        return;
    }


    const matrix =
        piece.matrix;


    const size =
        Math.min(
            rect.width / 5,
            rect.height / 4
        );


    const totalW =
        matrix[0].length * size;


    const totalH =
        matrix.length * size;


    const startX =
        (
            rect.width -
            totalW
        ) / 2;


    const startY =
        (
            rect.height -
            totalH
        ) / 2;


    for (
        let y = 0;
        y < matrix.length;
        y++
    ) {

        for (
            let x = 0;
            x < matrix[y].length;
            x++
        ) {

            if (
                matrix[y][x]
            ) {

                drawBlock(
                    context,

                    startX +
                    x * size,

                    startY +
                    y * size,

                    size,

                    matrix[y][x]
                );
            }
        }
    }
}


/* =========================================================
   DRAW SIDE PIECES
   ========================================================= */

function drawSidePieces() {

    drawMini(
        nextCtx,
        nextCanvas,
        nextPiece
    );


    drawMini(
        holdCtx,
        holdCanvas,
        holdPiece
    );
}

   UPDATE UI
   ========================================================= */

function updateUI() {

    scoreEl.textContent =
        score.toLocaleString();


    levelEl.textContent =

    linesEl.textContent =
        lines;
}

   OVERLAY BUTTONS
   ========================================================= */

function hideAllOverlayButtons() {

        "hidden-btn"
    );

    resumeBtn.classList.add(

    );

    restartBtn.classList.add(

    );

    exitBtn.classList.add(

    );
}

    );
}


function hideOverlay() {

    overlay.classList.add(

    );
}

   MAIN MENU
   ========================================================= */

function showMainMenu() {

    running = false;

    paused = false;


    cancelGameLoop();


    overlayTitle.textContent =

    overlayText.textContent =

    hideAllOverlayButtons();

}

   PAUSE MENU

function showPauseMenu() {

   GAME OVER MENU
   ========================================================= */

function showGameOverMenu() {

    );

    );

/* =========================================================
   GAME OVER
   ========================================================= */

function gameOver() {

    running = false;

    paused = false;


    cancelGameLoop();


    showGameOverMenu();
}


/* =========================================================
   START GAME
   ========================================================= */

function startGame() {

    cancelGameLoop();


    resetGame();


    running = true;

    paused = false;


    hideOverlay();


    lastTime =
        performance.now();


    dropTimer = 0;


    startGameLoop();
}


/* =========================================================
   RESTART GAME
   ========================================================= */

function restartGame() {

    cancelGameLoop();


    resetGame();


    running = true;

    paused = false;


    hideOverlay();


    lastTime =
        performance.now();


    dropTimer = 0;


    startGameLoop();
}


/* =========================================================
   PAUSE
   ========================================================= */

function pauseGame() {

    if (
        !running ||
        paused
    ) {
        return;
    }


    paused = true;


    cancelGameLoop();


    showPauseMenu();
}


/* =========================================================
   RESUME
   ========================================================= */

function resumeGame() {

    if (
        !running ||
        !paused
    ) {
        return;
    }


    paused = false;


    hideOverlay();


    lastTime =
        performance.now();


    dropTimer = 0;


    startGameLoop();
}


/* =========================================================
   TOGGLE PAUSE
   ========================================================= */

function togglePause() {

    if (
        !running
    ) {
        return;
    }


    if (
        paused
    ) {

        resumeGame();

    } else {

        pauseGame();
    }
}


/* =========================================================
   EXIT
   ========================================================= */

function exitGame() {

    cancelGameLoop();


    running = false;

    paused = false;


    /*
       Clear all in-memory game data.
    */

    board =
        createBoard();


    current = null;

    nextPiece = null;

    holdPiece = null;

    canHold = true;


    score = 0;

    level = 1;

    lines = 0;

    dropTimer = 0;


    updateUI();

    drawSidePieces();


    showMainMenu();


    draw();
}


/* =========================================================
   GAME LOOP CONTROL
   ========================================================= */

function cancelGameLoop() {

    if (
        animationFrameId !== null
    ) {

        cancelAnimationFrame(
            animationFrameId
        );


        animationFrameId = null;
    }
}


function startGameLoop() {

    cancelGameLoop();


    animationFrameId =
        requestAnimationFrame(
            loop
        );
}


/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(time) {

    animationFrameId = null;


    if (
        !running ||
        paused
    ) {

        return;
    }


    const delta =
        time - lastTime;


    lastTime =
        time;


    dropTimer += delta;


    const speed =
        Math.max(
            80,

            800 -
            (
                level - 1
            ) * 65
        );


    if (
        dropTimer >= speed
    ) {

        dropTimer = 0;


        if (
            !collide(
                current,
                0,
                1
            )
        ) {

            current.y++;

        } else {

            lockPiece();
        }
    }


    draw();


    if (
        running &&
        !paused
    ) {

        animationFrameId =
            requestAnimationFrame(
                loop
            );
    }
}

/* =========================================================
   KEYBOARD
   =========================================================

   IMPORTANT:

   ARROW UP DOES NOT ROTATE.

   ROTATION:

   X = CLOCKWISE
   Z = COUNTER-CLOCKWISE

   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
           Prevent browser scrolling.

           ArrowUp is intentionally NOT included
           because it has no game action.
        */

        if (
            [
                "ArrowLeft",
                "ArrowRight",
                "ArrowDown",
                " "
            ].includes(event.key)
        ) {

            event.preventDefault();
        }


        switch (
            event.key
        ) {


            /* LEFT */

            case "ArrowLeft":

                move(-1);

                break;


            /* RIGHT */

            case "ArrowRight":

                move(1);

                break;


            /* SOFT DROP */

            case "ArrowDown":

                softDrop();

                break;


            /* =========================================
               ROTATE CLOCKWISE

               X ONLY
               ========================================= */

            case "x":
            case "X":

                event.preventDefault();

                rotate();

                break;


            /* =========================================
               ROTATE COUNTER-CLOCKWISE

               Z ONLY
               ========================================= */

            case "z":
            case "Z":

                event.preventDefault();

                rotateCounterClockwise();

                break;


            /* HARD DROP */

            case " ":

                hardDrop();

                break;


            /* HOLD */

            case "c":
            case "C":

                hold();

                break;


            /* PAUSE */

            case "p":
            case "P":

                togglePause();

                break;


            /* RESTART */

            case "r":
            case "R":

                if (
                    running
                ) {

                    restartGame();

                } else {

                    startGame();
                }

                break;


            /* ESCAPE */

            case "Escape":

                if (
                    running
                ) {

                    if (
                        paused
                    ) {

                        exitGame();

                    } else {

                        pauseGame();
                    }
                }

                break;
        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOUCH / POINTER CONTROLS
   =========================================================

   TAP
   = ROTATE CLOCKWISE

   SWIPE LEFT
   = MOVE LEFT

   SWIPE RIGHT
   = MOVE RIGHT

   SWIPE DOWN
   = SOFT DROP

   SWIPE UP
   = HARD DROP

   Works with:

   Android
   iPhone
   iPad
   Android tablets
   Windows tablets
   Touch laptops

   ========================================================= */

let pointerStartX = 0;

let pointerStartY = 0;

let pointerStartTime = 0;

let pointerActive = false;


/*
   Explicitly disable browser gestures
   on the game board.
*/

canvas.style.touchAction =
    "none";


/* =========================================================
   POINTER DOWN
   ========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        /*
           Ignore right mouse button.
        */

        if (
            event.pointerType === "mouse" &&
            event.button !== 0
        ) {

            return;
        }


        pointerActive = true;


        pointerStartX =
            event.clientX;


        pointerStartY =
            event.clientY;


        pointerStartTime =
            performance.now();


        /*
           Keep receiving the pointer
           even if finger moves.
        */

        try {

            canvas.setPointerCapture(
                event.pointerId
            );

        } catch (
            error
        ) {

            /* Older browser:
               ignore. */
        }


        event.preventDefault();

    },
    {
        passive: false
    }
);


/* =========================================================
   POINTER UP
   ========================================================= */

canvas.addEventListener(
    "pointerup",
    event => {

        if (
            !pointerActive
        ) {

            return;
        }


        pointerActive = false;


        const dx =
            event.clientX -
            pointerStartX;


        const dy =
            event.clientY -
            pointerStartY;


        const duration =
            performance.now() -
            pointerStartTime;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /* ================================================
           TAP

           TAP = ROTATE CLOCKWISE
           ================================================ */

        if (
            distance < 25 &&
            duration < 350
        ) {

            rotate();


            event.preventDefault();


            return;
        }


        /* ================================================
           HORIZONTAL SWIPE
           ================================================ */

        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (
                Math.abs(dx) >= 30
            ) {

                if (
                    dx > 0
                ) {

                    move(1);

                } else {

                    move(-1);
                }
            }

        }


        /* ================================================
           VERTICAL SWIPE
           ================================================ */

        else {

            /*
               Swipe DOWN
               = SOFT DROP
            */

            if (
                dy >= 30
            ) {

                softDrop();
            }


            /*
               Swipe UP
               = HARD DROP
            */

            else if (
                dy <= -30
            ) {

                hardDrop();
            }
        }


        event.preventDefault();

    },
    {
        passive: false
    }
);


/* =========================================================
   POINTER CANCEL
   ========================================================= */

canvas.addEventListener(
    "pointercancel",
    () => {

        pointerActive = false;

    },
    {
        passive: true
    }
);


/* =========================================================
   PREVENT CONTEXT MENU ON GAME BOARD
   ========================================================= */

canvas.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        resizeCanvas();

        drawSidePieces();

    }
);


/* =========================================================
   ORIENTATION CHANGE
   ========================================================= */

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            () => {

                resizeCanvas();

                drawSidePieces();

            },
            100
        );
    }
);

/* =========================================================
   RESPONSIVE VIEWPORT RESIZE
   Handles mobile browser address bars, tablets and
   dynamic viewport changes more reliably.
   ========================================================= */

if (window.visualViewport) {
    window.visualViewport.addEventListener(
        "resize",
        () => {
            requestAnimationFrame(() => {
                resizeCanvas();
                drawSidePieces();
            });
        }
    );
}

if ("ResizeObserver" in window) {
    const boardObserver = new ResizeObserver(() => {
        resizeCanvas();
    });

    boardObserver.observe(
        document.querySelector(".board-wrap")
    );
}


/* =========================================================
   INITIALIZE
   ========================================================= */

resetGame();


resizeCanvas();


draw();


/*
   Start at main menu.
*/

showMainMenu();

</script>

</body>
</html>
